{d:"C",q:"An eccentric MR jet directed ANTERIORLY along the anterior leaflet suggests:",o:["Anterior leaflet prolapse","Posterior leaflet prolapse/flail","Annular dilation","Rheumatic restriction of anterior leaflet"],a:1,e:"The jet goes away from the prolapsing leaflet: posterior prolapse → anterior jet.",z:"後葉脫垂 → 射流向前。"},
{d:"C",q:"Ischaemic MR from tethering of the posterior leaflet is Carpentier type:",o:["I","II","IIIa","IIIb"],a:3,e:"IIIb = restricted systolic leaflet motion (ischaemic/functional).",z:"IIIb。"},
{d:"C",t:"match",q:"Match each Carpentier type with its mechanism.",pairs:[["Type I","Normal leaflet motion — annular dilation or perforation"],["Type II","Excessive motion — prolapse or flail"],["Type IIIa","Restricted in systole and diastole — rheumatic"],["Type IIIb","Restricted in systole — ischaemic tethering"]],e:"Carpentier functional classification of MR.",z:"Carpentier 功能分型。"},
{d:"C",q:"MVP should be diagnosed in which view?",o:["Apical 4-chamber","Parasternal long axis","Subcostal 4-chamber","PSAX at MV level"],a:1,e:"The saddle-shaped annulus makes A4C overcall prolapse; use PLAX (>2 mm above annular plane).",z:"PLAX。"},
{d:"C",q:"Which is a criterion for SEVERE TR?",o:["Jet area 4 cm²","VC 0.8 cm","Hepatic vein systolic dominance","Faint parabolic CW"],a:1,e:"Severe TR: VC ≥0.7 cm, EROA ≥0.40, RVol ≥45 mL, hepatic systolic reversal, dense triangular CW, jet area >10 cm².",z:"VC ≥0.7 cm 為嚴重 TR。"},
{d:"C",q:"Thickened, retracted, immobile tricuspid and pulmonic leaflets in a patient with flushing and diarrhoea suggest:",o:["Rheumatic disease","Carcinoid heart disease","Ebstein anomaly","Endocarditis"],a:1,e:"Carcinoid affects right-sided valves; left-sided only with PFO or lung metastases.",z:"類癌心臟病。"},
{d:"C",q:"Pulmonic stenosis peak velocity 4.5 m/s indicates:",o:["Mild","Moderate","Severe","Normal"],a:2,e:"Peak V >4 m/s (gradient >64 mmHg) = severe PS.",z:"嚴重 PS。"},
{d:"C",q:"A bileaflet mechanical MV shows three small closing jets inside the sewing ring. These are:",o:["Paravalvular leaks","Normal washing jets","Valve thrombosis","Dehiscence"],a:1,e:"Small, short 'washing' jets are designed into mechanical valves to reduce thrombus.",z:"正常沖洗射流。"},
{d:"C",q:"Prosthetic AV: Vmax 4.3 m/s, DVI 0.22, acceleration time 120 ms. This suggests:",o:["Normal function","High flow state","Prosthetic stenosis","Patient–prosthesis mismatch only"],a:2,e:"DVI <0.25 and AT >100 ms (rounded jet) point to obstruction. High flow keeps DVI normal; PPM usually keeps AT short.",z:"人工瓣狹窄。"},
{d:"C",q:"Indexed EOA of 0.60 cm²/m² in a normally functioning aortic prosthesis indicates:",o:["Normal","Moderate PPM","Severe PPM","Paravalvular leak"],a:2,e:"Aortic PPM: ≤0.85 moderate, ≤0.65 severe.",z:"嚴重人工瓣-患者不匹配。"},
{d:"C",q:"A prosthetic MV with VTI ratio (PrMV/LVOT) 2.8 and PHT 90 ms suggests:",o:["Stenosis","Significant regurgitation","Normal","PPM"],a:1,e:"High VTI ratio with a NORMAL PHT suggests increased flow from regurgitation. Stenosis would prolong PHT (>200 ms).",z:"VTI 比值高但 PHT 正常 → 明顯反流。"},
{d:"C",q:"Vegetations on the aortic valve typically attach to the:",o:["Aortic side","Ventricular (LVOT) side","Annulus only","Sinus of Valsalva"],a:1,e:"Vegetations form on the low-pressure side of the jet: ventricular side of semilunar valves.",z:"心室面（低壓側）。"},
{d:"C",q:"An echolucent space in the posterior aortic root of a patient with prosthetic AV endocarditis is most likely:",o:["Normal sinus","Perivalvular abscess","Lipoma","Myxoma"],a:1,e:"Perivalvular abscess (often at the aortic–mitral curtain). TEE is preferred.",z:"瓣周膿腫。"},
{d:"C",q:"The most common congenital cardiac anomaly overall is:",o:["Secundum ASD","Bicuspid aortic valve","Perimembranous VSD","PDA"],a:1,e:"Bicuspid AV occurs in 1–2% of the population.",z:"二葉主動脈瓣。"},
{d:"C",t:"multi",q:"Select ALL that are supportive signs of SEVERE AR.",o:["VC 0.7 cm","Jet width/LVOT 70%","PHT 600 ms","RF 55%","Brief early-diastolic reversal in descending aorta"],a:[0,1,3],e:"Severe: VC >0.6, jet width ≥65%, PHT <200, RF ≥50%, holodiastolic reversal. PHT 600 and brief reversal suggest mild.",z:"VC >0.6、射流寬 ≥65%、RF ≥50%。"},
{d:"C",q:"The Wilkins score assesses all EXCEPT:",o:["Leaflet mobility","Leaflet thickening","Commissural calcium only","Subvalvular thickening","Calcification"],a:2,e:"Wilkins: mobility, thickening, calcification, subvalvular apparatus. Commissural calcium is assessed in other scores.",z:"Wilkins 四項：活動度、增厚、鈣化、瓣下結構。"},
{d:"C",q:"Severe tricuspid stenosis is suggested by a mean gradient of:",o:["2 mmHg","3 mmHg","≥5 mmHg","≥10 mmHg"],a:2,e:"TS severe: MG ≥5 mmHg, PHT ≥190 ms, TVA ≤1.0 cm².",z:"≥5 mmHg。"},
// ---------- B: imaging ----------
{d:"B",q:"Ultrasound enhancing agent is indicated when how many contiguous LV segments are not visualised?",o:["1","2 or more","4 or more","6 or more"],a:1,e:"Contrast is recommended when ≥2 contiguous segments are not seen.",z:"≥2 個相鄰節段。"},
{d:"B",q:"During contrast LV opacification you see swirling in the apex. The best adjustment is to:",o:["Raise the MI","Give more contrast or lower the MI","Increase gain","Use fundamental imaging"],a:1,e:"Swirling means bubble destruction or too little contrast: lower the MI or increase the dose.",z:"降低 MI 或增加造影劑。"},
{d:"B",q:"Bubbles appear in the LA 6 cardiac cycles after RA opacification, entering from the pulmonary veins. Most likely:",o:["PFO","Secundum ASD","Intrapulmonary shunt","Persistent LSVC"],a:2,e:"Late appearance (>3–5 cycles) from the pulmonary veins indicates an intrapulmonary shunt.",z:"肺內分流。"},
{d:"B",q:"Which manoeuvre increases detection of a PFO during a bubble study?",o:["Inspiration hold","Release of Valsalva","Left lateral decubitus","Handgrip"],a:1,e:"Releasing Valsalva transiently raises RA pressure above LA pressure.",z:"Valsalva 釋放。"},
{d:"B",q:"A 60-year-old's target heart rate for stress echo is:",o:["136 bpm","145 bpm","160 bpm","170 bpm"],a:0,e:"(220 − 60) × 0.85 = 136 bpm.",z:"(220−60)×0.85 = 136。"},
{d:"B",q:"On treadmill stress echo, post-exercise images should be acquired within:",o:["15 s","60–90 s","3 min","5 min"],a:1,e:"Wall-motion abnormalities can resolve quickly, so image within 60–90 s (ideally <60 s).",z:"60–90 秒內。"},
{d:"B",q:"On DSE a segment improves at low dose and worsens at peak dose. This is:",o:["Scar","Normal","Viable but ischaemic myocardium","Stunned only"],a:2,e:"Biphasic response = viable myocardium with ischaemia.",z:"雙相反應：存活但缺血。"},
{d:"B",q:"A patient becomes cyanotic after TEE with a normal arterial PaO₂. Suspect:",o:["Aspiration","Methaemoglobinaemia from benzocaine","Oesophageal perforation","Vasovagal reaction"],a:1,e:"Topical benzocaine can cause methaemoglobinaemia (pulse oximetry ~85%, chocolate-coloured blood).",z:"苯佐卡因致高鐵血紅蛋白症。"},
{d:"B",q:"Which TEE view best shows the interatrial septum, SVC and IVC together?",o:["ME four-chamber","ME bicaval","ME AV SAX","Transgastric SAX"],a:1,e:"ME bicaval at ~90–110°.",z:"ME 雙腔切面。"},
{d:"B",q:"Which is an ABSOLUTE contraindication to TEE?",o:["Atrial fibrillation","Oesophageal stricture","Prosthetic MV","Prior CABG"],a:1,e:"Oesophageal stricture, tumour, perforation and active upper GI bleed are absolute contraindications.",z:"食道狹窄。"},
{d:"B",q:"The Doppler angle is 30°. Velocity is underestimated by about:",o:["0%","6%","13%","50%"],a:2,e:"cos 30° = 0.87 → ~13% underestimation.",z:"cos30° = 0.87，低估約 13%。"},
{d:"B",q:"Which Doppler mode has range resolution but is limited by aliasing?",o:["CW","PW","Colour M-mode","Non-imaging Pedoff"],a:1,e:"PW samples a specific depth but aliases above the Nyquist limit.",z:"PW。"},
{d:"B",t:"match",q:"Match each finding with the best window.",pairs:[["Coarctation","Suprasternal notch"],["Secundum ASD","Subcostal"],["LVOT diameter","Parasternal long axis"],["Biplane LVEF","Apical 4 & 2 chamber"]],e:"Each window has a classic job.",z:"各窗口的經典用途。"},
{d:"B",q:"EPSS of 12 mm on M-mode suggests:",o:["Normal LV function","Reduced LVEF","Mitral stenosis","HCM"],a:1,e:"EPSS >7 mm correlates with reduced EF (or AR / MS can affect it).",z:"EPSS >7 mm 提示 EF 下降。"},
{d:"B",q:"For TDI e′ measurements you should:",o:["Raise wall filter and gain","Lower wall filter and gain, small sample volume at the annulus","Use CW","Use the highest Nyquist possible"],a:1,e:"Myocardial signals are low velocity and high amplitude: lower filter, low gain, 5–10 mm sample at the annulus.",z:"低壁濾波、低增益。"},
{d:"B",q:"A 3D full-volume LV acquisition shows step-like discontinuities. The cause is:",o:["Too low MI","Stitching artefact from arrhythmia or breathing","Harmonic imaging","Low line density"],a:1,e:"Multi-beat 3D acquisitions stitch sub-volumes; movement or irregular rhythm causes stitching.",z:"拼接偽影。"},
{d:"B",q:"GLS changes from −21% at baseline to −16% during chemotherapy. The relative change is:",o:["5%, not significant","24%, suggests cardiotoxicity","−5%, improvement","Cannot be judged"],a:1,e:"(21 − 16)/21 = 24% relative fall (>15% is significant).",z:"相對下降 24% >15%，提示心臟毒性。"},
{d:"B",q:"Which is the correct high-MI use in contrast echo?",o:["LV opacification","'Flash' to destroy microbubbles for perfusion replenishment","Reducing swirling","Bubble study"],a:1,e:"A brief high-MI flash clears bubbles; replenishment shows myocardial perfusion.",z:"高 MI 閃爆用於灌注評估。"},
// ---------- E: physics ----------
{d:"E",q:"The wavelength of a 3 MHz transducer in soft tissue is about:",o:["0.15 mm","0.51 mm","1.5 mm","5.1 mm"],a:1,e:"λ = 1.54 ÷ 3 = 0.51 mm.",z:"1.54/3 = 0.51 mm。"},
{d:"E",q:"Which change improves AXIAL resolution?",o:["Lower frequency","Increase pulse cycles","Higher frequency","Increase depth"],a:2,e:"Axial resolution = SPL/2; higher frequency shortens λ and SPL.",z:"提高頻率。"},
{d:"E",q:"Lateral resolution is best:",o:["In the near field","At the focus","In the far field","It is constant"],a:1,e:"Lateral resolution equals beam width, narrowest at the focus.",z:"焦點處最好。"},
{d:"E",q:"A reflector produces an echo returning 130 µs after transmission. Its depth is:",o:["5 cm","10 cm","13 cm","20 cm"],a:1,e:"13 µs per cm → 130 ÷ 13 = 10 cm.",z:"130/13 = 10 cm。"},
{d:"E",q:"Total attenuation of a 4 MHz beam travelling 5 cm into soft tissue (one way):",o:["2 dB","5 dB","10 dB","20 dB"],a:2,e:"0.5 × 4 × 5 = 10 dB.",z:"0.5×4×5 = 10 dB。"},
{d:"E",q:"Intensity drops by 3 dB. The new intensity is:",o:["One-third","Half","One-tenth","Unchanged"],a:1,e:"−3 dB = half the intensity.",z:"−3 dB = 一半。"},
{d:"E",q:"PRF is 8 kHz. The Nyquist limit is:",o:["2 kHz","4 kHz","8 kHz","16 kHz"],a:1,e:"Nyquist = PRF ÷ 2.",z:"PRF/2 = 4 kHz。"},
{d:"E",t:"multi",q:"Select ALL actions that reduce PW aliasing.",o:["Shift the baseline","Increase the velocity scale (PRF)","Increase sample volume depth","Use a lower-frequency transducer","Switch to CW"],a:[0,1,3,4],e:"Deeper sampling LOWERS the max PRF and worsens aliasing.",z:"增加取樣深度會加重混疊。"},
{d:"E",q:"Which change will INCREASE frame rate?",o:["Increase depth","Add focal zones","Narrow the sector","Increase line density"],a:2,e:"Fewer lines per frame (narrow sector) shortens frame time.",z:"縮窄扇區。"},
{d:"E",q:"Equally spaced parallel bright lines deep to the pericardium are:",o:["Mirror image","Reverberation","Refraction","Side lobe"],a:1,e:"Reverberation: multiple reflections between two strong reflectors.",z:"混響。"},
{d:"E",q:"A second copy of the heart appears side-by-side (lateral) to the real one. This is:",o:["Mirror image","Refraction","Reverberation","Range ambiguity"],a:1,e:"Refraction displaces objects laterally, producing a side-by-side duplicate.",z:"折射。"},
{d:"E",q:"A copy of a structure appears DEEPER than the true one, behind a strong reflector. This is:",o:["Mirror image","Refraction","Side lobe","Comet tail"],a:0,e:"Mirror image artefacts are placed deeper along the beam, beyond a strong specular reflector.",z:"鏡像偽影。"},
{d:"E",q:"Range ambiguity places echoes:",o:["Too deep","Too shallow","Laterally","In the correct place"],a:1,e:"Echoes from earlier pulses return after the next pulse is sent and are placed too shallow.",z:"太淺。"},
{d:"E",q:"Following ALARA, an image is too dark. The FIRST step should be:",o:["Increase output power","Increase receiver gain","Increase MI","Change transducer"],a:1,e:"Increase receiver gain before transmit power — no extra patient exposure.",z:"先提高接收增益。"},
{d:"E",q:"The mechanical index relates mainly to:",o:["Tissue heating","Cavitation","Frame rate","Attenuation"],a:1,e:"MI = peak rarefactional pressure ÷ √f; predicts cavitation risk.",z:"空化。"},
{d:"E",q:"Matching layer thickness is:",o:["λ/2","λ/4","2λ","λ"],a:1,e:"Matching layer = ¼ wavelength; the PZT crystal = ½ wavelength.",z:"λ/4。"},
{d:"E",q:"Propagation speed depends on:",o:["Frequency","Amplitude","The medium","Power"],a:2,e:"Speed is determined only by the medium's stiffness and density.",z:"介質。"},
{d:"E",q:"Which can only be applied BEFORE an image is frozen?",o:["Read zoom","Write zoom","Colour map (B-colour)","Contrast variation"],a:1,e:"Write zoom is pre-processing; read zoom is post-processing.",z:"寫放大為前處理。"},
{d:"E",t:"match",q:"Match the artefact with its mechanism.",pairs:[["Shadowing","High attenuation behind a strong reflector/calcium"],["Enhancement","Low attenuation behind fluid"],["Grating lobes","Off-axis energy from array transducers"],["Comet tail","Closely spaced reverberation from a small strong reflector"]],e:"Artefact mechanisms.",z:"偽影機制配對。"},
{d:"E",q:"Harmonic imaging improves image quality because:",o:["It uses a lower receive frequency","Harmonics form in tissue and have fewer near-field and side-lobe artefacts","It increases frame rate","It reduces MI"],a:1,e:"Harmonics are produced as the beam travels through tissue, mostly in the strong central beam.",z:"諧波在組織中產生，偽影較少。"},
{d:"E",q:"Reflection at a boundary requires:",o:["Oblique incidence","Different propagation speeds","Different acoustic impedances","High frequency"],a:2,e:"Reflection needs an impedance mismatch. Refraction needs oblique incidence and different speeds.",z:"需聲阻抗差。"},
{d:"E",q:"A 2.0 MHz transducer produces a Doppler shift that is ___ the shift from a 4.0 MHz transducer at the same velocity.",o:["Twice","Half","Equal to","Four times"],a:1,e:"Δf ∝ f₀, so halving frequency halves the shift — less aliasing.",z:"頻移減半。"},
// ---------- A: preparation ----------
{d:"A",q:"Before starting an echo, the sonographer should confirm patient identity using:",o:["Room number","Two identifiers such as name and DOB","Wristband colour","Referring doctor's name"],a:1,e:"Two patient-specific identifiers are required.",z:"兩個識別資料。"},
{d:"A",q:"You find a large pericardial effusion with RV diastolic collapse. The correct action is to:",o:["Finish the full protocol, then write a note","Notify the physician immediately","Tell the patient they have tamponade","Book a follow-up echo"],a:1,e:"Tamponade signs are a critical finding — notify the physician immediately and document.",z:"立即通知醫生。"},
{d:"A",q:"Which posture reduces sonographer musculoskeletal injury?",o:["Shoulder abducted 90°","Shoulder abduction <30° with arm supported","Wrist flexed","Leaning over the bed"],a:1,e:"Keep shoulder abduction under 30°, neutral wrist, supported arm and cable.",z:"肩外展 <30°。"},
{d:"A",q:"Why is blood pressure recorded at the time of the echo?",o:["Billing","To calculate LAP, LVEDP and shunt pressures","To set TGC","It is not needed"],a:1,e:"BP is used with Doppler gradients to estimate intracardiac pressures.",z:"用於計算心內壓力。"},
{d:"A",q:"A patient asks whether their valve is 'bad'. The sonographer should:",o:["Give the severity grade","Explain that the physician will interpret the study and discuss results","Ignore the question","Show the worst images"],a:1,e:"Diagnosis and results are communicated by the interpreting physician.",z:"由醫生解釋結果。"},
{d:"A",t:"multi",q:"Select ALL findings that should be reported as critical results.",o:["Aortic dissection flap","Mobile LV thrombus","Trace MR","Large mobile vegetation","Mild LVH"],a:[0,1,3],e:"Critical: dissection, tamponade, mobile thrombus/vegetation, rupture, prosthetic thrombosis.",z:"夾層、活動血栓、大型贅生物。"},
{d:"A",q:"During a dobutamine stress echo the patient collapses and is unresponsive with no normal breathing. What is the FIRST priority after calling for help?",o:["Finish the peak-stress images","Start chest compressions at 100–120/min","Give IV metoprolol","Check the IVC"],a:1,e:"Unresponsive and not breathing normally → activate the emergency response and begin high-quality CPR (100–120/min, 5–6 cm). Attach an AED as soon as available.",z:"無反應且無正常呼吸 → 求救並立即做高質素 CPR。"},
{d:"A",q:"A TEE probe must undergo which level of reprocessing between patients?",o:["Low-level disinfection","Intermediate disinfection","High-level disinfection","Wipe with alcohol only"],a:2,e:"The TEE probe contacts mucous membranes (semi-critical, Spaulding) and requires high-level disinfection plus leak testing.",z:"TEE 接觸黏膜 → 半關鍵 → 高度消毒。"},
{d:"A",q:"After TEE with topical benzocaine the patient is cyanotic with SpO₂ 85% that does not improve on oxygen. Most likely cause?",o:["Oesophageal perforation","Methaemoglobinaemia","Vasovagal reaction","Contrast allergy"],a:1,e:"Benzocaine can cause methaemoglobinaemia — cyanosis and low SpO₂ unresponsive to O₂. Treatment: methylene blue.",z:"苯佐卡因可致高鐵血紅蛋白血症，用亞甲藍治療。"},
{d:"A",t:"multi",q:"Select TWO actions that protect patient privacy (HIPAA).",o:["Discuss the case in the lift with a colleague","Log off the workstation when leaving","Share only the minimum necessary information","Post an interesting image on social media without the name"],a:[1,2],e:"Log off, minimum necessary. Public discussion and posting images (even de-named) can still identify a patient.",z:"登出系統、最少必要原則。"},
{d:"A",q:"Which drug reverses midazolam sedation?",o:["Naloxone","Flumazenil","Atropine","Aminophylline"],a:1,e:"Flumazenil reverses benzodiazepines; naloxone reverses opioids; aminophylline reverses dipyridamole.",z:"Flumazenil 逆轉苯二氮䓬類。"},
{d:"A",q:"A patient refuses the TEE after the procedure is explained. Which ethical principle requires you to respect this?",o:["Beneficence","Justice","Autonomy","Non-maleficence"],a:2,e:"Autonomy — a competent patient may refuse; inform the physician and document.",z:"自主原則。"},
{d:"D",q:"Which fetal structure becomes the ligamentum arteriosum?",o:["Ductus venosus","Foramen ovale","Ductus arteriosus","Umbilical vein"],a:2,e:"Ductus arteriosus → ligamentum arteriosum. Ductus venosus → ligamentum venosum; foramen ovale → fossa ovalis.",z:"動脈導管 → 動脈韌帶。"},
{d:"D",q:"A cleft anterior mitral leaflet is most often associated with:",o:["Secundum ASD","Primum ASD","Sinus venosus ASD","PFO"],a:1,e:"Primum ASD is an endocardial cushion defect and often has a cleft anterior MV leaflet.",z:"原發孔 ASD（心內膜墊缺損）常合併二尖瓣前葉裂。"},
{d:"D",q:"Thick-walled LV, biatrial enlargement and a GLS bull's-eye with preserved apical strain suggest:",o:["Hypertensive heart disease","Cardiac amyloidosis","Athlete's heart","Apical HCM"],a:1,e:"Relative apical sparing of longitudinal strain is typical of cardiac amyloidosis.",z:"心尖保留 → 澱粉樣變。"},
{d:"D",q:"On serial echo during chemotherapy, which change most suggests early cardiotoxicity when EF is still normal?",o:["GLS falls from −21% to −16%","GLS changes from −20% to −19%","E/A rises from 1.0 to 1.1","LVEF 62% to 60%"],a:0,e:"−21 → −16% is a ~24% relative fall (>15% likely significant). A 5% relative change is within variability.",z:"GLS 相對下降 >15% 提示早期心毒性。"},
{d:"D",q:"In an LVAD patient the septum bows toward the LV and the LV is small. The most likely issue is:",o:["Pump speed too low","Pump speed too high / suction","Aortic regurgitation","Outflow graft obstruction"],a:1,e:"Over-unloading (speed too high or hypovolaemia) pulls the septum leftward and can cause suction events. Speed too low → LV dilates, septum bows right.",z:"轉速過高 → 室間隔向左偏、左室細小。"},
{d:"D",q:"Where should the Impella inlet sit?",o:["In the LA","~3.5–4 cm below the aortic annulus in the LV","In the ascending aorta","At the LV apex touching the wall"],a:1,e:"Inlet in the LV about 3.5–4 cm below the annulus, outlet above the AV, clear of the mitral apparatus.",z:"入口位於主動脈瓣環下約3.5–4 cm。"},
{d:"D",t:"match",q:"Match each modality with its main strength.",pairs:[["Cardiac MRI","Late gadolinium enhancement (scar)"],["Cardiac CT","TAVR annulus sizing / coronary calcium"],["SPECT","Myocardial perfusion"],["Catheterisation","Direct pressure measurement"]],e:"MRI: tissue characterisation; CT: anatomy/calcium; SPECT: perfusion; cath: haemodynamics.",z:"MRI 組織特徵；CT 解剖；SPECT 灌注；導管 壓力。"},
{d:"C",q:"Tricuspid inflow mean gradient 6 mmHg with PHT 200 ms suggests:",o:["Normal TV","Significant tricuspid stenosis","Severe TR","Pulmonary hypertension"],a:1,e:"Mean gradient ≥5 mmHg and PHT ≥190 ms indicate haemodynamically significant TS (ASE/EAE 2009).",z:"平均壓差 ≥5、PHT ≥190 ms → 顯著三尖瓣狹窄。"},
{d:"C",q:"Which finding indicates severe pulmonic regurgitation?",o:["PR PHT 250 ms","Jet confined to the valve","PR PHT <100 ms with diastolic flow reversal in branch PAs","Late-peaking PR velocity"],a:2,e:"Severe PR: short PHT (<100 ms), steep deceleration, wide jet and branch PA diastolic reversal (ASE 2017).",z:"PHT <100 ms 及分支肺動脈逆流 → 嚴重 PR。"},
{d:"C",q:"A mechanical MV 3 weeks after starting a low INR shows a large, soft, mobile mass with a rising gradient. Most likely?",o:["Pannus","Thrombus","Suture","Strut artefact"],a:1,e:"Thrombus: larger, soft, mobile, short history, subtherapeutic anticoagulation. Pannus is small, dense, chronic.",z:"大、軟、可活動、抗凝不足 → 血栓。"},
{d:"C",q:"Prosthetic AV: peak velocity 3.8 m/s, DVI 0.22, AT 120 ms. Interpretation?",o:["Normal function","High flow state","Possible prosthetic obstruction","Patient–prosthesis mismatch"],a:2,e:"DVI <0.25 and AT >100 ms with a high velocity point to obstruction (ASE prosthetic valve guidance).",z:"DVI <0.25、AT >100 ms → 可能阻塞。"},
{d:"B",q:"LFLG AS with EF 30%: on dobutamine SV rises 25%, AVA increases from 0.8 to 1.3 cm², mean gradient 28 mmHg. This is:",o:["True severe AS","Pseudo-severe AS","No contractile reserve","Severe AR"],a:1,e:"Flow reserve present (SV ↑≥20%). AVA rising >1.0 cm² with gradient <40 mmHg = pseudo-severe AS.",z:"AVA 增大至 >1.0、壓差 <40 → 假性嚴重 AS。"},
{d:"B",q:"In HCM with a resting LVOT gradient of 15 mmHg, which maneuver is MOST likely to unmask obstruction?",o:["Handgrip","Squatting","Valsalva / standing","Passive leg raise"],a:2,e:"Reducing preload (Valsalva strain, standing) or exercise increases the gradient. Handgrip and squatting decrease it.",z:"Valsalva 或站立（減前負荷）增加壓差。"},
{d:"B",t:"multi",q:"Select TWO findings that make a diastolic stress test abnormal.",o:["Average E/e′ >14 at peak exercise","TR velocity >2.8 m/s at peak exercise","Heart rate rises to 85% predicted","E/A ratio 1.2 at rest"],a:[0,1],e:"ASE/EACVI 2016: exercise average E/e′ >14 (or septal >15) and peak TR >2.8 m/s.",z:"運動 E/e′ >14 及 TR >2.8 m/s。"},
{d:"B",q:"Exercise echo in MS: which result supports intervention in a patient with discordant symptoms?",o:["Mean gradient 9 mmHg","Mean gradient 17 mmHg","PASP 40 mmHg","HR rise 30 bpm"],a:1,e:"Exercise mean gradient >15 mmHg (or PASP >60 mmHg) is significant (ACC/AHA).",z:"運動平均壓差 >15 mmHg。"},
{d:"E",q:"0.000 002 m expressed in micrometres is:",o:["0.2 µm","2 µm","20 µm","2000 µm"],a:1,e:"Micro = 10⁻⁶. 2 × 10⁻⁶ m = 2 µm.",z:"2×10⁻⁶ m = 2 µm。"},
{d:"E",q:"During LV opacification, contrast swirls at the apex. Best adjustment?",o:["Increase MI","Lower MI / give slightly more agent","Increase depth","Turn off harmonics"],a:1,e:"Apical swirling = microbubble destruction (MI too high, focus too near) or too little agent. Lower MI, move focus to mitral level, adjust dose.",z:"心尖漩渦 → 降低 MI 或增加劑量。"},

/* ---------- diastolic function (2016 ASE) ---------- */
function diastolicGrade(v){const steps=[];const ok=x=>x!=null&&!isNaN(x);
 const avgE=(ok(v.sep)&&ok(v.lat))?(v.sep+v.lat)/2:null;const EeAvg=(ok(v.E)&&avgE)?v.E/avgE:null;
 if(v.ef==="normal"){
  const crit=[["Average E/e′ >14",EeAvg==null?null:EeAvg>14,EeAvg==null?"—":fmt(EeAvg)],
   ["Septal e′ <7 or lateral e′ <10 cm/s",(ok(v.sep)||ok(v.lat))?((ok(v.sep)&&v.sep<7)||(ok(v.lat)&&v.lat<10)):null,`${fmt(v.sep)} / ${fmt(v.lat)}`],
   ["TR velocity >2.8 m/s",ok(v.tr)?v.tr>2.8:null,fmt(v.tr,2)],["LAVI >34 mL/m²",ok(v.lavi)?v.lavi>34:null,fmt(v.lavi)]];
  const av=crit.filter(c=>c[1]!==null),pos=av.filter(c=>c[1]).length;
  crit.forEach(c=>steps.push(`${c[0]}: ${c[2]} → ${c[1]===null?"not available":c[1]?"POSITIVE":"negative"}`));
  if(av.length<2)return{grade:"Insufficient data",cls:"warn",steps,zh:"資料不足"};
  if(pos>av.length/2){steps.push(`${pos}/${av.length} positive (>50%) → diastolic dysfunction. Grade it with the reduced-EF branch.`);const r=diastolicGrade(Object.assign({},v,{ef:"reduced"}));return{grade:r.grade,cls:r.cls,steps:steps.concat(r.steps),zh:r.zh}}
  if(pos<av.length/2){steps.push(`${pos}/${av.length} positive (<50%) → normal diastolic function`);return{grade:"Normal diastolic function",cls:"ok",steps,zh:"舒張功能正常"}}
  steps.push("Exactly 50% positive → indeterminate");return{grade:"Indeterminate",cls:"warn",steps,zh:"不確定"}}
 const EA=(ok(v.E)&&ok(v.A)&&v.A>0)?v.E/v.A:null;steps.push(`E/A = ${fmt(EA,2)}, E = ${fmt(v.E)} cm/s`);
 if(EA==null)return{grade:"Need E and A",cls:"warn",steps,zh:"需要 E 和 A"};
 if(EA<=0.8&&v.E<=50){steps.push("E/A ≤0.8 and E ≤50 → normal LAP");return{grade:"Grade I — impaired relaxation, normal LAP",cls:"warn",steps,zh:"I 級：鬆弛受損、左房壓正常"}}
 if(EA>=2){steps.push("E/A ≥2 → raised LAP");return{grade:"Grade III — restrictive filling, raised LAP",cls:"bad",steps,zh:"III 級：限制性充盈、左房壓升高"}}
 steps.push("Intermediate E/A → check three criteria");
 const c3=[["Average E/e′ >14",EeAvg==null?null:EeAvg>14],["TR >2.8 m/s",ok(v.tr)?v.tr>2.8:null],["LAVI >34",ok(v.lavi)?v.lavi>34:null]];
 c3.forEach(c=>steps.push(`${c[0]}: ${c[1]===null?"not available":c[1]?"POSITIVE":"negative"}`));
 const av=c3.filter(c=>c[1]!==null),pos=av.filter(c=>c[1]).length,neg=av.length-pos;
 if(av.length===3||av.length===2&&pos!==neg){if(pos>=2)return{grade:"Grade II — pseudonormal, raised LAP",cls:"bad",steps,zh:"II 級：假性正常、左房壓升高"};
  if(neg>=2)return{grade:"Grade I — impaired relaxation, normal LAP",cls:"warn",steps,zh:"I 級：鬆弛受損、左房壓正常"};}
 return{grade:"Indeterminate LAP",cls:"warn",steps,zh:"左房壓不確定"}}

/* ---------- Nyquist / aliasing ---------- */
function wNyquist(el){
 const S=[["v","True peak velocity","m/s",.2,3,.05,1.2],["prf","PRF (scale)","kHz",1,15,.5,5],["f0","Transducer frequency","MHz",1.5,5,.1,2.5],["ang","Angle to flow","°",0,60,1,0],["base","Baseline shift up","%",-60,60,5,0]];
 el.innerHTML=`<div class="row"><span class="label">PW aliasing simulator</span></div><div class="ctrl">${S.map(s=>`<label for="ny-${s[0]}">${s[1]} <output id="nyo-${s[0]}"></output><input id="ny-${s[0]}" type="range" min="${s[3]}" max="${s[4]}" step="${s[5]}" value="${s[6]}"></label>`).join("")}</div><div id="nySvg" style="overflow-x:auto"></div><div class="readout" id="nyRo"></div>`;
 const run=()=>{const v={};S.forEach(s=>{v[s[0]]=+$("#ny-"+s[0],el).value;$("#nyo-"+s[0],el).textContent=v[s[0]]+" "+s[2]});
  const c=1540,cos=Math.cos(v.ang*Math.PI/180);const vmeas=v.v*cos;const shiftHz=2*v.f0*1e6*vmeas/c;const nyqHz=v.prf*1000/2;
  const vny=c*v.prf*1000/(4*v.f0*1e6);const top=vny*(1-v.base/100),bot=-vny*(1+v.base/100),range=top-bot;
  const W=600,H=200,y0=10,y1=190;const vy=x=>y0+(top-x)/(range)*(y1-y0);
  let lines="";const beat=x=>{const t=(x%200)/200;return t<.35?Math.sin(t/.35*Math.PI):0};
  for(let x=0;x<W;x+=2){const vel=-vmeas*beat(x);// flow away (below baseline) like LVOT
   if(vel===0)continue;let disp=vel;if(vel<bot){lines+=`<line x1="${x}" y1="${vy(0)}" x2="${x}" y2="${vy(bot)}" stroke="var(--fg)" stroke-opacity=".75"/>`;disp=vel+range;lines+=`<line x1="${x}" y1="${vy(top)}" x2="${x}" y2="${vy(Math.max(disp,0))}" stroke="var(--toward)" stroke-opacity=".9"/>`}
   else lines+=`<line x1="${x}" y1="${vy(0)}" x2="${x}" y2="${vy(disp)}" stroke="var(--fg)" stroke-opacity=".75"/>`}
  const aliased=vmeas>-bot+1e-9;
  $("#nySvg",el).innerHTML=`<svg viewBox="0 0 ${W+60} ${H}" width="${W+60}" role="img" aria-label="Spectral Doppler display"><rect x="0" y="${y0}" width="${W}" height="${y1-y0}" fill="var(--bg)" stroke="var(--line)"/>${lines}<line x1="0" y1="${vy(0)}" x2="${W}" y2="${vy(0)}" stroke="var(--away)" stroke-width="1.5"/><text x="${W+6}" y="${y0+10}" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">+${fmt(top,2)}</text><text x="${W+6}" y="${vy(0)+4}" font-size="11" font-family="var(--f-mono)" fill="var(--away)">0</text><text x="${W+6}" y="${y1}" font-size="11" font-family="var(--f-mono)" fill="var(--muted)">${fmt(bot,2)}</text><text x="${W+6}" y="${H/2+30}" font-size="10" font-family="var(--f-mono)" fill="var(--faint)">m/s</text></svg>`;
  $("#nyRo",el).innerHTML=[["Doppler shift",fmt(shiftHz/1000,2)+" kHz"],["Nyquist (PRF/2)",fmt(nyqHz/1000,2)+" kHz"],["Max measurable V",fmt(vny,2)+" m/s"],["Measured V (cos θ)",fmt(vmeas,2)+" m/s"],["Underestimation",fmt((1-cos)*100,0)+"%",v.ang>20],["Status",aliased?"ALIASING":"No aliasing",aliased]].map(r=>`<div class="ro ${r[2]?"hot":""}"><b>${r[1]}</b><span>${r[0]}</span></div>`).join("")};
 $$("input",el).forEach(i=>i.addEventListener("input",run));run()}

  <div class="row"><button class="btn primary" id="go">Start</button></div></div>
  ${S.runs&&S.runs.length?`<div class="panel stack"><h3>Recent sessions</h3>${S.runs.slice(-6).reverse().map(r=>`<div class="row" style="justify-content:space-between"><span>${new Date(r.at).toLocaleDateString()} · ${r.mode==="exam"?"Timed mix":r.mode==="miss"?"Misses":"Practice "+(r.dom==="all"?"all":r.dom)}</span><span class="pill ${r.pct>=75?"ok":r.pct>=60?"warn":"bad"}">${r.right}/${r.n} · ${r.pct}%</span></div>`).join("")}</div>`:""}</section>`;
  $$("[data-m]",m).forEach(b=>b.onclick=()=>{mode=b.dataset.m;setup()});$$("[data-d]",m).forEach(b=>b.onclick=()=>{dom=b.dataset.d;setup()});$$("[data-n]",m).forEach(b=>b.onclick=()=>{count=+b.dataset.n;setup()});
  $("#go",m).onclick=()=>{let qs;if(mode==="exam")qs=pickBlueprint(count);else if(mode==="miss")qs=shuffle(misses());else qs=shuffle(QUIZ.filter(q=>dom==="all"||q.d===dom)).slice(0,count);
   if(!qs.length){$("#go",m).insertAdjacentHTML("afterend",`<span style="color:var(--muted)">No questions to review yet — answer some first.</span>`);return}run(qs)}};
 const run=qs=>{quizActive=true;let i=0;const ans=[];const timed=mode==="exam";const t0=Date.now(),limit=qs.length*60e3;let tick=null;
  const finish=()=>{clearInterval(tick);quizActive=false;const right=ans.filter(a=>a.ok).length;const pct=Math.round(right/qs.length*100);
   S.runs=(S.runs||[]).concat([{at:Date.now(),mode,dom,n:qs.length,right,pct}]).slice(-30);save();
   const byD=DOMAINS.map(d=>{const a=ans.filter(x=>x.q.d===d.id);return a.length?{d,n:a.length,r:a.filter(x=>x.ok).length}:null}).filter(Boolean);
   m.innerHTML=`<section class="view"><div class="view-head"><span class="label">Results</span><h1>${right} / ${qs.length} correct · ${pct}%</h1><p>${pct>=75?"Strong. Keep mixing domains.":pct>=60?"Close to passing level. Review the misses below.":"Below target. Re-read the notes for the domains marked red, then retry your misses."} The real exam is scaled; aim for 75%+ here.</p></div>
    <div class="panel stack"><h3>By domain</h3>${byD.map(x=>`<div class="row" style="justify-content:space-between"><span>${x.d.name}</span><span class="pill ${x.r/x.n>=.75?"ok":x.r/x.n>=.6?"warn":"bad"}">${x.r}/${x.n}</span></div>`).join("")}</div>
    ${ans.filter(a=>!a.ok).length?`<div class="stack"><h2>Review misses</h2>${ans.filter(a=>!a.ok).map(a=>`<div class="panel stack"><p class="q-stem">${a.q.q}</p><p><b>Answer:</b> ${answerText(a.q)}</p><div class="explain"><span>${a.q.e}</span>${zh(a.q.z)}</div><a href="#notes-${a.q.d}">Open ${DOMAINS.find(d=>d.id===a.q.d).short} notes</a></div>`).join("")}</div>`:""}
    <div class="row"><button class="btn primary" id="again">New quiz</button></div></section>`;$("#again",m).onclick=setup};
  const show=()=>{const q=qs[i];let sel=q.t==="multi"?new Set():null,checked=false;const prac=!timed;
   m.innerHTML=`<section class="view"><div class="row" style="justify-content:space-between"><span class="label">Question ${i+1} of ${qs.length} · ${DOMAINS.find(d=>d.id===q.d).short}${q.t!=="mcq"?" · "+({multi:"select all that apply",match:"matching",hot:"hot spot"})[q.t]:""}</span>${timed?`<span class="timer" id="tmr"></span>`:""}</div><div class="qbar"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="panel stack"><p class="q-stem">${q.q}</p><div id="qBody"></div><div id="qExp"></div><div class="row"><button class="btn primary" id="qBtn">${q.t==="mcq"&&prac?"Choose an answer":"Check"}</button><button class="btn ghost" id="qQuit">End quiz</button></div></div></section>`;
   const body=$("#qBody",m),btn=$("#qBtn",m);
   if(timed){btn.textContent=i<qs.length-1?"Next":"Finish";const up=()=>{const left=Math.max(0,limit-(Date.now()-t0));const tm=$("#tmr");if(tm)tm.textContent=`${Math.floor(left/60000)}:${String(Math.floor(left/1000)%60).padStart(2,"0")} left`;if(left<=0){record(false,true);finish()}};clearInterval(tick);tick=setInterval(up,1000);up()}
   if(q.t==="mcq"||q.t==="multi"){const order=shuffle(q.o.map((_,k)=>k));body.innerHTML=`<div class="opts">${order.map((k,pos)=>`<button class="opt" data-k="${k}" aria-pressed="false"><span class="key">${String.fromCharCode(65+pos)}</span><span>${q.o[k]}</span></button>`).join("")}</div>`;
    $$(".opt",body).forEach(b=>b.onclick=()=>{if(checked)return;const k=+b.dataset.k;if(q.t==="multi"){sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute("aria-pressed",sel.has(k))}else{sel=k;$$(".opt",body).forEach(x=>x.setAttribute("aria-pressed",x===b));if(prac)check()}})}
   else if(q.t==="match"){const rights=shuffle(q.pairs.map(p=>p[1]));body.innerHTML=`<div class="match">${q.pairs.map((p,k)=>`<span class="term">${p[0]}</span><select id="mt-${k}" aria-label="Match for ${p[0]}"><option value="">Choose…</option>${rights.map(r=>`<option>${r}</option>`).join("")}</select>`).join("")}</div>`}
   else if(q.t==="hot"){body.innerHTML=`<div class="row" style="justify-content:center">${bullseyeSVG({plain:true})}</div><p class="cite" style="text-align:center" id="hotSel">No segment selected</p>`;
    $$(".seg",body).forEach(s=>s.addEventListener("click",()=>{if(checked)return;sel=+s.dataset.seg;$$(".seg",body).forEach(x=>{x.setAttribute("fill",x===s?"var(--away)":"var(--panel-2)")});$("#hotSel",body).textContent="Selected: segment "+sel}))}
   const isRight=()=>{if(q.t==="mcq")return sel===q.a;if(q.t==="multi")return sel.size===q.a.length&&q.a.every(k=>sel.has(k));if(q.t==="hot")return q.a.includes(sel);
    if(q.t==="match")return q.pairs.every((p,k)=>$("#mt-"+k,body).value===p[1]);return false};
   const answered=()=>q.t==="mcq"||q.t==="hot"?sel!=null:q.t==="multi"?sel.size>0:q.pairs.every((p,k)=>$("#mt-"+k,body).value);
   function record(ok,silent){const r=S.quiz[q.id]||{c:0,w:0};ok?r.c++:r.w++;r.last=ok;S.quiz[q.id]=r;ans.push({q,ok});save()}
   function check(){if(!answered()){btn.textContent=q.t==="match"?"Match every item first":"Choose an answer first";return}checked=true;const ok=isRight();
    if(q.t==="mcq"||q.t==="multi"){const A=q.t==="mcq"?[q.a]:q.a;$$(".opt",body).forEach(b=>{const k=+b.dataset.k;if(A.includes(k))b.classList.add("right");else if(b.getAttribute("aria-pressed")==="true")b.classList.add("wrong")})}
    if(q.t==="match")q.pairs.forEach((p,k)=>{const s=$("#mt-"+k,body);s.classList.add(s.value===p[1]?"right":"wrong");s.disabled=true});
    if(q.t==="hot")$$(".seg",body).forEach(x=>{const n=+x.dataset.seg;if(q.a.includes(n))x.setAttribute("fill","var(--ok)");else if(n===sel)x.setAttribute("fill","var(--toward)")});
    record(ok);$("#qExp",m).innerHTML=`<div class="explain"><span class="pill ${ok?"ok":"bad"}">${ok?"Correct":"Not quite"}</span>${q.t==="match"&&!ok?`<span><b>Answer:</b> ${answerText(q)}</span>`:""}<span>${q.e}</span>${zh(q.z)}</div>`;
    btn.textContent=i<qs.length-1?"Next question":"See results"}
   btn.onclick=()=>{if(timed){if(!answered()){btn.textContent="Choose an answer first";setTimeout(()=>btn.textContent=i<qs.length-1?"Next":"Finish",1200);return}record(isRight());i++;i<qs.length?show():finish();return}
    if(!checked){check();return}i++;i<qs.length?show():finish()};
   $("#qQuit",m).onclick=()=>{if(!ans.length){clearInterval(tick);setup();return}qs=qs.slice(0,ans.length);finish()};
   m._qkey=e=>{if(current!=="quiz"||!quizActive||e.target.closest("select,input"))return;if((q.t==="mcq"||q.t==="multi")&&/^[a-e]$/i.test(e.key)){const b=$$(".opt",body)[e.key.toLowerCase().charCodeAt(0)-97];b&&b.click()}else if(e.key==="Enter"&&!e.target.closest("button")){btn.click()}}};
  show()};
 setup()}
document.addEventListener("keydown",e=>{const m=$("#main");m&&m._qkey&&current==="quiz"&&m._qkey(e)});
function answerText(q){if(q.t==="mcq")return q.o[q.a];if(q.t==="multi")return q.a.map(k=>q.o[k]).join("; ");if(q.t==="match")return q.pairs.map(p=>p[0]+" → "+p[1]).join(" · ");if(q.t==="hot")return"Segment "+q.a.join(" or ")+" ("+SEGS[q.a[0]][0]+")";return""}

/* ---------- cheat sheet ---------- */
function findTable(secId,n=0){for(const d in NOTES)for(const s of NOTES[d])if(s.id===secId){return s.blocks.filter(b=>b.table)[n].table}}
function mini(title,t,cols){const idx=cols||t.head.map((_,i)=>i);return`<div class="panel"><h4 style="margin-bottom:6px">${title}</h4><div class="tbl-wrap"><table><thead><tr>${idx.map(i=>`<th>${t.head[i]}</th>`).join("")}</tr></thead><tbody>${t.rows.map(r=>`<tr>${idx.map(i=>`<td class="${(t.sev||[]).includes(i)?"sev":""}">${r[i]}</td>`).join("")}</tr>`).join("")}</tbody></table></div></div>`}
function renderCheat(m){
 const devices={head:["Item","Value"],rows:[["Adult CPR","100–120/min · 5–6 cm · 30:2"],["TEE probe","High-level disinfection"],["Reversal","Midazolam→flumazenil · opioid→naloxone"],["Impella inlet","~3.5–4 cm below AV annulus"],["Watchman leak",">5 mm significant"],["Cardio-onc GLS","Relative fall >15%"],["LV non-compaction","NC/C >2 end-systole"]]};

 const phys={head:["Constant","Value"],rows:[["Speed in soft tissue","1540 m/s · 1.54 mm/µs"],["Depth timing","13 µs round trip per cm"],["Wavelength","λ (mm) = 1.54 ÷ f (MHz)"],["Attenuation","0.5 dB/cm/MHz"],["Axial resolution","SPL ÷ 2"],["Nyquist","PRF ÷ 2"],["Max PRF","77,000 ÷ depth (cm)"],["Frame rate","77,000 ÷ (depth × lines × foci)"],["Matching layer / crystal","λ/4 · λ/2"],["dB","+3 = ×2 · +10 = ×10"],["Angle error","20° = 6% · 30° = 13% · 60° = 50%"]]};
 const stress={head:["Item","Value"],rows:[["Target HR","85% × (220 − age)"],["Treadmill images","≤60–90 s post exercise"],["Dobutamine","5/10→40 µg/kg/min, 3-min stages ± atropine"],["Bubble study PFO","LA bubbles ≤3 cycles"],["UEA","≥2 contiguous segments unseen · low MI 0.1–0.3"],["Tamponade","RA systolic collapse (sens.) · RV diastolic collapse (spec.)"],["PH","TR >2.8 m/s · AT <105 ms"]]};
 m.innerHTML=`<section class="view" style="max-width:1100px"><div class="view-head"><span class="label">Cheat sheet</span><h1>One-page numbers</h1><p>The cut-offs most likely to be tested, on one screen. Severe columns are in red. ${zh("最常考的數值一覽，嚴重級別以紅色顯示。")}</p></div><div class="row" role="group" aria-label="Tools"><a class="chip" href="#calc" aria-current="false">Calculators</a><a class="chip" href="#cheat" aria-current="true">Cheat sheet</a></div>
 <div class="cheat">${mini("Aortic stenosis",findTable("c-as"))}${mini("Mitral regurgitation",findTable("c-mr"),[0,1,3])}${mini("Aortic regurgitation",findTable("c-ar"))}${mini("Mitral stenosis",findTable("c-ms"))}${mini("Tricuspid regurgitation",findTable("c-right"))}${mini("Chamber normals",findTable("d-chambers"),[0,1])}${mini("IVC → RAP",findTable("d-chambers",1))}${mini("Diastolic grades",findTable("d-diastolic"))}${mini("Prosthetic AV",findTable("c-pros"))}${mini("Prosthetic MV",findTable("c-pros",1))}${mini("Hemodynamic formulas",findTable("d-hemo"))}${mini("Physics constants",phys)}${mini("Procedures & quick signs",stress)}${mini("Safety, drugs & devices",devices)}${mini("Non-ischaemic stress & right valves",nonisch)}</div></section>`}

route();

})();
