<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fffaf0"><style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body>
<title>Shita RCS Echo Lab · Bubu &amp; Dudu Edition</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shita RCS">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:ital,wght@0,400;0,600;0,800;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: storybook sky — a cream study column under a pastel sky, chunky ink outlines and sticker shadows; a soft grassy hill anchors the rail. */
:root{
  --sky:#a9dfe4; --sky-2:#d8f1f2; --cream:#fffaf0; --butter:#f7dc8a; --cocoa:#b98a68; --blush:#f5b5b5; --grass:#c3e3a5; --ink:#3b2a24; --cloud:#ffffff;
  --bg:#fffaf0; --panel:#ffffff; --panel-2:#f4ecdf; --line:#e3d5c4;
  --fg:#3b2a24; --muted:#7a6457; --faint:#a8968a;
  --away:#2c8590; --away-soft:#dcf2f3; --toward:#cf4f63; --toward-soft:#fde4e4;
  --ok:#3d8a46; --ok-soft:#e5f4d8; --warn:#a46d0a; --warn-soft:#fdf1cc;
  --bmode:#3b2a24; --shadow:#3b2a24;
  --f-display:"Fredoka","Baloo 2","Varela Round",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  --f-zh:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#1f3c52; --sky-2:#18303f; --cream:#1a1714; --butter:#e2c26a; --cocoa:#c99a76; --blush:#e79a9a; --grass:#4f7a43; --ink:#f3e7d6; --cloud:#33536a;
  --bg:#171412; --panel:#221d19; --panel-2:#2c2621; --line:#433a32;
  --fg:#f6ecdf; --muted:#c9b7a6; --faint:#8e7d6f;
  --away:#7fd3db; --away-soft:#163a40; --toward:#f59aa6; --toward-soft:#43232a;
  --ok:#9bd38a; --ok-soft:#203a1d; --warn:#f2c867; --warn-soft:#3d3014;
  --bmode:#f3e7d6; --shadow:#0a0807; color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1f3c52; --sky-2:#18303f; --cream:#1a1714; --butter:#e2c26a; --cocoa:#c99a76; --blush:#e79a9a; --grass:#4f7a43; --ink:#f3e7d6; --cloud:#33536a;
  --bg:#171412; --panel:#221d19; --panel-2:#2c2621; --line:#433a32;
  --fg:#f6ecdf; --muted:#c9b7a6; --faint:#8e7d6f;
  --away:#7fd3db; --away-soft:#163a40; --toward:#f59aa6; --toward-soft:#43232a;
  --ok:#9bd38a; --ok-soft:#203a1d; --warn:#f2c867; --warn-soft:#3d3014;
  --bmode:#f3e7d6; --shadow:#0a0807; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:800}
h3{font-size:1.12rem;font-weight:700}
h4{font-size:.98rem;font-weight:700}
p{margin:0}
a{color:var(--away)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--away);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-family:var(--f-display);font-stretch:100%;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;font-weight:700;color:var(--muted)}
.zh{font-family:var(--f-zh);color:var(--muted);font-size:.92em}
body:not(.show-zh) .zh{display:none}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:22px 16px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--panel)}
.brand{display:flex;flex-direction:column;gap:8px}
.brand-name{font-family:var(--f-display);font-weight:800;font-stretch:75%;font-size:1.55rem;letter-spacing:.01em;line-height:1}
.brand-sub{font-size:.78rem;color:var(--muted)}
.scale{display:flex;align-items:stretch;gap:6px;font-family:var(--f-mono);font-size:.62rem;color:var(--muted)}
.scale-bar{width:10px;border-radius:2px;background:linear-gradient(180deg,#ffe36b 0%,#ff5a3c 22%,#8a1410 48%,#0d0d0d 50%,#0c2a78 52%,#2f6bff 78%,#7fe6ff 100%)}
.scale-ticks{display:flex;flex-direction:column;justify-content:space-between}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--fg);font-weight:700;font-size:.94rem}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--away-soft);color:var(--away)}
.nav .k{font-family:var(--f-mono);font-size:.7rem;color:var(--faint);font-weight:400}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:.88rem}
.switch{position:relative;width:38px;height:22px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:20px;background:var(--line);transition:.2s}
.switch span::after{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;border-radius:50%;background:var(--panel);transition:.2s}
.switch input:checked+span{background:var(--away)}
.switch input:checked+span::after{transform:translateX(16px)}
.switch input:focus-visible+span{outline:2px solid var(--away);outline-offset:2px}
.sync{font-size:.74rem;color:var(--faint)}

main{padding-inline:clamp(16px,4vw,48px);padding-block:28px 80px;min-width:0}
.view{max-width:980px;display:flex;flex-direction:column;gap:22px}
.view-head{display:flex;flex-direction:column;gap:6px}
.view-head p{color:var(--muted);max-width:68ch}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:.92rem}
.btn:hover{border-color:var(--away)}
.btn.primary{background:var(--away);border-color:var(--away);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0c1118}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0c1118}}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:700;cursor:pointer}
a.chip{text-decoration:none;color:var(--fg)}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:.74rem;font-weight:700;font-family:var(--f-display);letter-spacing:.04em;text-transform:uppercase}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--toward-soft);color:var(--toward)}
.pill.info{background:var(--away-soft);color:var(--away)}

/* dashboard */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{background:var(--panel);padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.fact b{font-family:var(--f-display);font-stretch:75%;font-size:1.9rem;font-weight:800;line-height:1}
.fact span{font-size:.8rem;color:var(--muted)}
.bp{display:flex;flex-direction:column;gap:14px}
.bp-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.bp-name{font-weight:700;font-size:.95rem}
.bp-pct{font-family:var(--f-mono);font-size:.85rem}
.bp-track{grid-column:1/-1;height:12px;border-radius:5px;background:transparent;position:relative;overflow:hidden}
.bp-w{position:absolute;inset:0 auto 0 0;background:var(--away-soft);border:1px solid var(--away);border-radius:5px}
.bp-p{position:absolute;inset:0 auto 0 0;height:100%;background:var(--away);border-radius:5px}
.bp-meta{grid-column:1/-1;font-size:.78rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

/* notes */
.domain-tabs{display:flex;gap:6px;flex-wrap:wrap}
.toc{display:flex;flex-wrap:wrap;gap:6px}
.toc a{font-size:.82rem;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--fg);background:var(--panel)}
.toc a.done{border-color:var(--ok);color:var(--ok)}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sec-head .zh{display:block;font-size:.9rem;margin-top:3px}
.bul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:8px;max-width:76ch}
.bul li::marker{color:var(--away)}
.bul .zh{display:block;margin-top:1px}
.callout{border-radius:8px;padding:10px 14px;font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.callout.pearl{background:var(--ok-soft)}
.callout.pit{background:var(--toward-soft)}
.callout .label{color:inherit;opacity:.85}
.callout.pearl .label{color:var(--ok)} .callout.pit .label{color:var(--toward)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:520px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--panel-2);font-family:var(--f-display);font-stretch:90%;font-weight:700;font-size:.82rem;letter-spacing:.02em}
td{font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.sev{color:var(--toward);font-weight:700}
.cite{font-size:.76rem;color:var(--faint)}
.check{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.check input{width:17px;height:17px;accent-color:var(--ok)}

/* widgets */
.widget{border:1px dashed var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.widget svg{display:block;max-width:100%;height:auto}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px 18px}
.ctrl label{display:flex;flex-direction:column;gap:3px;font-size:.84rem;font-weight:700}
.ctrl output{font-family:var(--f-mono);font-weight:400;color:var(--away)}
input[type=range]{width:100%;accent-color:var(--away)}
.readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px}
.ro{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.ro b{display:block;font-family:var(--f-mono);font-size:1.05rem}
.ro span{font-size:.74rem;color:var(--muted)}
.ro.hot b{color:var(--toward)}
.seg{cursor:pointer;stroke:var(--panel);stroke-width:1.5}
.seg:hover{opacity:.85}
.tree-node{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tree-path{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem}
.tree-path span{background:var(--panel-2);border-radius:5px;padding:2px 8px}

/* calculators */
.calc{display:flex;flex-direction:column;gap:12px}
.calc .inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.calc label{display:flex;flex-direction:column;gap:3px;font-size:.8rem;font-weight:700;color:var(--muted)}
.calc input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:7px 9px;font-family:var(--f-mono);width:100%}
.result{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.result b{font-family:var(--f-display);font-stretch:80%;font-size:1.8rem;font-weight:800}
.steps{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);background:var(--bg);border-radius:7px;padding:9px 11px;white-space:pre-wrap;overflow-x:auto}
.formula{font-family:var(--f-mono);font-size:.86rem;color:var(--away)}

/* flashcards */
.card-stage{perspective:1200px}
.fcard{position:relative;min-height:260px;cursor:pointer;transform-style:preserve-3d;transition:transform .45s}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;display:flex;flex-direction:column;justify-content:center;gap:12px;overflow:auto}
.face.back{transform:rotateY(180deg)}
.face .q{font-family:var(--f-display);font-stretch:90%;font-size:1.35rem;font-weight:700;line-height:1.25}
.face .a{font-size:1.08rem}
.face .meta{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between}
.srs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.srs .btn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px}
.srs .btn small{font-weight:400;color:var(--muted);font-size:.74rem}
@media (prefers-reduced-motion: reduce){.fcard{transition:none}}

/* quiz */
.q-stem{font-size:1.08rem;font-weight:700;max-width:72ch}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--panel);border-radius:9px;padding:11px 13px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--away)}
.opt .key{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--muted);flex:none;margin-top:2px}
.opt[aria-pressed="true"]{border-color:var(--away);background:var(--away-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--toward);background:var(--toward-soft)}
.explain{border-left:3px solid var(--away);padding:8px 14px;background:var(--panel-2);border-radius:0 8px 8px 0;display:flex;flex-direction:column;gap:6px;font-size:.94rem}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.match .term{font-weight:700;font-size:.92rem;align-self:center}
.match select{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px;width:100%}
.match select.right{border-color:var(--ok)} .match select.wrong{border-color:var(--toward)}
.qbar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--away)}
.timer{font-family:var(--f-mono);font-size:.9rem}

/* cheat sheet */
.cheat{columns:2 340px;column-gap:18px}
.cheat .panel{break-inside:avoid;margin-bottom:14px;padding:14px}
.cheat table{min-width:0;font-size:.82rem}
.cheat th,.cheat td{padding:4px 7px}

/* phone */
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;z-index:5;flex-direction:row;align-items:center;padding:10px 16px;gap:12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand .brand-sub,.brand .scale,.rail-foot .sync{display:none}
  .brand-name{font-size:1.2rem;white-space:nowrap}
  .nav{flex-direction:row;gap:2px}
  .nav a{padding:7px 9px;font-size:.86rem;white-space:nowrap}
  .nav .k{display:none}
  .rail-foot{margin-top:0;flex-direction:row}
  .toggle .lbl{display:none}
  main{padding-block:20px 60px}
  h1{font-size:1.55rem}
  .sec{padding:16px}
}

/* ---- storybook theme layer ---- */
h1,h2,h3,h4,.brand-name,.fact b,.result b,.face .q{font-stretch:normal;letter-spacing:0}
h1{font-weight:700;font-size:2rem} h2{font-weight:700} h3,h4{font-weight:600}
.label{font-stretch:normal;font-weight:600;letter-spacing:.06em}
body{background:var(--bg)}
main{background:linear-gradient(180deg,var(--sky) 0,var(--sky-2) 180px,var(--bg) 340px);position:relative}
main::before{content:"";position:absolute;inset:18px 0 auto 0;height:120px;pointer-events:none;opacity:.95;
 background:radial-gradient(circle at 78% 52%,var(--cloud) 0 26px,transparent 27px),radial-gradient(circle at 83% 40%,var(--cloud) 0 34px,transparent 35px),radial-gradient(circle at 89% 54%,var(--cloud) 0 24px,transparent 25px),radial-gradient(ellipse 70px 20px at 84% 62%,var(--cloud) 0 98%,transparent),
 radial-gradient(circle at 55% 22%,var(--cloud) 0 14px,transparent 15px),radial-gradient(circle at 58.5% 15%,var(--cloud) 0 18px,transparent 19px),radial-gradient(circle at 62% 23%,var(--cloud) 0 12px,transparent 13px)}
main>.view{position:relative}
.rail{background:var(--cream);border-right:2px solid var(--ink);overflow:hidden}
.rail::after{content:"";position:absolute;left:-30%;right:-30%;bottom:-70px;height:150px;border-radius:50%;background:var(--grass);border-top:2px solid var(--ink);z-index:0}
.rail>*{position:relative;z-index:1}
.brand-name{font-weight:700;font-size:1.5rem;line-height:1.05;color:var(--fg)}
.brand-name span{display:block;font-size:.95rem;color:var(--cocoa);font-weight:600}
.brand-mark{display:flex;gap:6px;align-items:center}
.brand-mark i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);display:block}
.nav a{border-radius:14px;font-family:var(--f-display);font-weight:600;border:2px solid transparent}
.nav a:hover{background:var(--panel-2)}
.nav a[aria-current="page"]{background:var(--butter);color:var(--ink);border-color:var(--ink);box-shadow:2px 2px 0 var(--shadow)}
:root[data-theme="dark"] .nav a[aria-current="page"]{color:#2b1f1a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .nav a[aria-current="page"]{color:#2b1f1a}}
.panel,.sec,.facts,.face,.tree-node{border:2px solid var(--ink);border-radius:var(--r);box-shadow:4px 4px 0 var(--shadow)}
.facts{gap:2px;background:var(--ink)}
.fact b{font-family:var(--f-display);font-weight:700;color:var(--cocoa)}
.ro{border:2px solid var(--line);border-radius:14px}
.widget{border:2px dashed var(--cocoa);border-radius:var(--r);background:var(--cream)}
.btn{border:2px solid var(--ink);border-radius:999px;font-family:var(--f-display);font-weight:600;box-shadow:2px 2px 0 var(--shadow);transition:transform .08s,box-shadow .08s}
.btn:hover{border-color:var(--ink);transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--cocoa);border-color:var(--ink);color:#fffaf0}
.chip{border:2px solid var(--ink);font-family:var(--f-display);font-weight:600}
.chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--sky);color:var(--ink);border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--away);color:#14262a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"],.chip[aria-current="true"]{background:var(--away);color:#14262a}}
.pill{font-family:var(--f-display);font-weight:600;letter-spacing:.03em;border:1.5px solid currentColor}

 {b:[["Effusion: echo-free space; pericardial effusion tracks anterior to the descending aorta in PLAX, pleural effusion tracks posterior to it.","心包積液在 PLAX 位於降主動脈前方；胸腔積液位於降主動脈後方。"],
     ["Size (diastole): small <10 mm, moderate 10–20 mm, large >20 mm.","大小（舒張期）：少量 <10 mm、中量 10–20 mm、大量 >20 mm。"],
     ["Epicardial fat: anterior, granular, moves with heart; usually not posterior.","心外膜脂肪：通常在前方、顆粒狀，一般不在後方。"]]},
 {table:{head:["Feature","Tamponade","Constriction","Restriction"],rows:[
  ["Chamber collapse","RA systolic collapse (>⅓ cycle, sensitive); RV diastolic collapse (specific)","None","None"],
  ["IVC","Plethoric, <50% collapse","Plethoric","Plethoric"],
  ["Respiratory variation","Mitral E ↓ >25–30% on inspiration; tricuspid E ↑ >40–60%","Mitral E variation >25%","Minimal (<10%)"],
  ["Septum","Swings with respiration","Diastolic bounce + respiratory shift","Normal"],
  ["Tissue Doppler e′","Normal","Preserved/high septal e′ (≥9 cm/s); lateral < septal = annulus reversus","Low e′ (<6 cm/s)"],
  ["Hepatic veins","Expiratory diastolic flow reversal / loss of D","Expiratory diastolic reversal","Inspiratory diastolic reversal"],
  ["Pericardium","Effusion","Thickened/bright, may calcify","Normal"]],cite:"Mayo criteria for constriction: respiratory septal shift + medial e′ ≥9 cm/s + hepatic vein expiratory diastolic reversal ratio ≥0.79."}},
 {pearl:["'Annulus paradoxus': in constriction, E/e′ falls as filling pressure rises because septal e′ stays high.","「瓣環矛盾」：縮窄性心包炎中，雖然充盈壓高，但中隔 e′ 仍高，所以 E/e′ 反而偏低。"]},
 {pit:["Tamponade is a clinical diagnosis. Report RA/RV collapse and a plethoric IVC immediately as a critical finding.","心包填塞是臨床診斷；發現 RA/RV 塌陷及 IVC 擴張應立即作為危急值通報。"]}
]},
{id:"d-ph",t:"Pulmonary hypertension & the right heart",zh:"肺動脈高壓與右心",blocks:[
 {b:[["RVSP (= PASP without RVOT/PV obstruction) = 4 × TR Vmax² + RAP.","RVSP（無 RVOT/肺動脈瓣阻塞時 = PASP）= 4 × TR Vmax² + RAP。"],
     ["TR Vmax >2.8 m/s raises the probability of PH; >3.4 m/s = high probability.","TR Vmax >2.8 m/s 提示可能肺動脈高壓；>3.4 m/s 為高可能性。"],
     ["Mean PAP ≈ 4 × (early-diastolic PR velocity)² + RAP. PA diastolic pressure ≈ 4 × (end-diastolic PR velocity)² + RAP.","平均肺動脈壓 ≈ 4 × 舒張早期 PR 速度² + RAP；肺動脈舒張壓 ≈ 4 × 舒張末期 PR 速度² + RAP。"],
     ["RVOT acceleration time <105 ms and mid-systolic notching suggest PH (and pulmonary vascular disease).","RVOT 加速時間 <105 ms 及收縮中期切跡提示肺動脈高壓。"],
     ["D-shaped septum: flattening in systole = RV pressure overload; flattening mainly in diastole = RV volume overload. Eccentricity index >1.1.","D 形中隔：收縮期變平 = 壓力負荷；舒張期變平 = 容量負荷。偏心指數 >1.1。"]]},
 {pearl:["Acute PE: McConnell's sign = RV free-wall akinesis with apical sparing; '60/60 sign' = RVOT AT <60 ms with TR gradient <60 mmHg.","急性肺栓塞：McConnell 徵象（RV 游離壁無運動但心尖保留）；60/60 徵象。"]}
]},
{id:"d-aorta",t:"Great vessels & aortic disease",zh:"大血管與主動脈疾病",blocks:[
 {b:[["Measure the aortic root at the annulus (inner edge, mid-systole) and at the sinuses, STJ and ascending aorta (leading-edge to leading-edge, end-diastole per ASE).","主動脈根部：瓣環（收縮中期、內緣）；竇部、STJ 及升主動脈（舒張末期、前緣到前緣）。"],
     ["Dissection: mobile intimal flap; true lumen expands in systole and has forward flow; false lumen is often larger, with slow flow or thrombus.","主動脈夾層：活動的內膜片；真腔收縮期擴張並有前向血流；假腔通常較大、血流慢或有血栓。"],
     ["Stanford A involves the ascending aorta (surgical emergency); Stanford B is distal to the left subclavian. Look for AR, effusion/tamponade and coronary involvement.","Stanford A 型累及升主動脈（外科急症）；B 型位於左鎖骨下動脈遠端。留意 AR、心包積液及冠脈受累。"],
     ["Marfan: effacement of the sinotubular junction (pear/flask-shaped root). Bicuspid aortopathy: ascending aorta dilation.","馬凡綜合症：STJ 消失（梨形根部）；二葉主動脈瓣：升主動脈擴張。"],
     ["Coarctation (suprasternal notch): high velocity in descending aorta with diastolic run-off ('sawtooth'); associated with bicuspid AV.","主動脈縮窄（胸骨上窩切面）：降主動脈高速並有舒張期持續血流；常與二葉瓣合併。"]]},
 {pit:["A linear reverberation in the ascending aorta can mimic a dissection flap. A real flap moves independently and does not cross anatomic boundaries.","升主動脈的混響偽影可類似夾層內膜片；真正的內膜片有獨立運動，不會越過解剖邊界。"]}
]},
{id:"d-mass",t:"Masses, thrombi & normal variants",zh:"腫塊、血栓與正常變異",blocks:[
 {table:{head:["Mass","Typical site & look"],rows:[
  ["Myxoma","Most common primary benign tumour; LA, stalk on the fossa ovalis; can prolapse through the MV (pseudo-MS)"],
  ["Papillary fibroelastoma","Most common valve tumour; small, frond-like, mobile, on the aortic side of AV or atrial side of MV"],
  ["Lipomatous hypertrophy of IAS","Dumbbell-shaped septum, spares the fossa ovalis"],
  ["Rhabdomyoma","Most common tumour in children; multiple, in ventricles; tuberous sclerosis"],
  ["Fibroma","Children; single, large, in the ventricular wall, may calcify"],
  ["Metastasis","Most common cardiac tumour overall (20–40× primary); often pericardial effusion"],
  ["LA/LAA thrombus","AF, MS; best seen on TEE; spontaneous echo contrast ('smoke') is a precursor"],
  ["LV thrombus","Akinetic apex after anterior MI; contrast confirms (no enhancement)"]]}},
 {table:{head:["Normal variant","Where"],rows:[
  ["Eustachian valve","IVC–RA junction"],["Chiari network","RA, fenestrated mobile strands"],["Crista terminalis","Posterior RA wall, ridge"],["Moderator band","RV apex (septal to free wall); identifies the RV"],["Coumadin ridge","Between LAA and left upper pulmonary vein"],["Lambl's excrescences","Thin strands on AV coaptation edges"],["False tendon","LV, chord-like band across the cavity"],["Nodules of Arantius","Thickening at the centre of AV cusps"]]}}
]},
{id:"d-chd",t:"Congenital heart disease (adult)",zh:"成人先天性心臟病",blocks:[
 {table:{head:["Lesion","Key points"],rows:[
  ["Secundum ASD","Most common ASD (~70%); fossa ovalis region; RV volume overload; best seen subcostal"],
  ["Primum ASD","AV-canal type; associated with cleft anterior MV leaflet; both AV valves at same level"],
  ["Sinus venosus ASD","Superior type near SVC; associated partial anomalous pulmonary venous return (right upper PV)"],
  ["Coronary sinus ASD","Unroofed coronary sinus; may coexist with persistent LSVC"],
  ["Perimembranous VSD","Most common VSD (~70–80%); just below AV in PSAX at ~10–11 o'clock; tricuspid aneurysmal tissue may seal it"],
  ["Muscular VSD","Trabecular septum; often multiple ('Swiss cheese')"],
  ["Outlet / supracristal VSD","Below the PV, ~1–2 o'clock in PSAX; AV cusp prolapse causes AR"],
  ["PDA","Continuous flow into the main PA near the left PA origin (PSAX)"],
  ["Bicuspid AV","Most common congenital lesion (1–2%); fish-mouth opening; R–L fusion most common; with coarctation and aortopathy"],
  ["Tetralogy of Fallot","VSD + overriding aorta + RVOT obstruction + RVH; adults after repair: PR, RV dilation"],
  ["Ebstein anomaly","Apical displacement of septal TV leaflet ≥8 mm/m²; atrialised RV; associated ASD/PFO, WPW"],
  ["Persistent LSVC","Dilated coronary sinus; agitated saline from LEFT arm fills the CS before the RA"],
  ["Coarctation","See great vessels: SSN view, diastolic run-off"]]}},
 {pearl:["Qp:Qs = (RVOT CSA × RVOT VTI) ÷ (LVOT CSA × LVOT VTI). >1.5 indicates a hemodynamically significant left-to-right shunt.","Qp:Qs >1.5 表示具有血流動力學意義的左向右分流。"]},
 {pit:["Normal TV septal leaflet inserts slightly more apical than the anterior MV leaflet. An absent offset = AV septal defect; an exaggerated one (≥8 mm/m²) = Ebstein.","正常三尖瓣隔葉附著點稍低於二尖瓣前葉；兩者同一水平提示 AVSD；偏移過大（≥8 mm/m²）為 Ebstein。"]}
]},
{id:"d-hemo",t:"Hemodynamics & devices",zh:"血流動力學與植入裝置",blocks:[
 {table:{head:["What you want","Formula"],rows:[
  ["Pressure gradient","ΔP = 4V² (simplified Bernoulli); use 4(V₂² − V₁²) if proximal V >1.5 m/s"],
  ["Stroke volume","SV = CSA × VTI; CSA = 0.785 × D²"],
  ["Cardiac output / index","CO = SV × HR; CI = CO ÷ BSA (normal ≈ 2.5–4.0 L/min/m²)"],
  ["LA pressure","LAP = SBP − 4(MR Vmax)² (no AS/LVOT obstruction)"],
  ["LVEDP","LVEDP = DBP − 4(AR end-diastolic V)²"],
  ["RVSP","4(TR Vmax)² + RAP"],
  ["PA diastolic","4(PR end-diastolic V)² + RAP"],
  ["VSD: RVSP","SBP − 4(VSD Vmax)²"],
  ["PDA: PASP","SBP − 4(PDA Vmax)²"]]}},
 {b:[["Implanted devices: pacemaker/ICD leads cause reverberation and shadowing in RA/RV; look for lead vegetations and lead-related TR.","起搏器/ICD 導線會造成混響與聲影；留意導線贅生物及導線相關 TR。"],
     ["LVAD: inflow cannula at the LV apex, outflow graft to ascending aorta. Check AV opening, septal position (midline), LV size, RV function, cannula flow (no aliasing/obstruction).","LVAD：流入管在心尖，流出管接升主動脈；觀察主動脈瓣開啟、中隔位置、LV 大小、RV 功能及管道血流。"],
     ["Closure devices (ASD/PFO occluder, LAA occluder): check position, residual leak and device-related thrombus.","封堵器：檢查位置、殘餘分流及裝置相關血栓。"]]}
]},
{id:"d-embryo",t:"Cardiac embryology & fetal circulation",zh:"心臟胚胎學與胎兒循環",blocks:[
 {b:[["The heart tube forms and starts beating in the 3rd–4th week of gestation; septation of atria, ventricles and outflow tracts takes place over roughly weeks 4–8.","心管約於妊娠第3–4週形成並開始跳動；心房、心室及流出道分隔大約在第4–8週完成。"],
     ["Fetal shunts: oxygenated blood from the umbilical vein → ductus venosus → IVC → RA → foramen ovale → LA. RV output bypasses the lungs through the ductus arteriosus to the descending aorta.","胎兒分流：臍靜脈含氧血 → 靜脈導管 → IVC → 右房 → 卵圓孔 → 左房；右室血經動脈導管繞過肺部進入降主動脈。"],
     ["After birth: foramen ovale → fossa ovalis (a PFO in ~25% of adults); ductus arteriosus → ligamentum arteriosum; ductus venosus → ligamentum venosum; umbilical vein → ligamentum teres.","出生後：卵圓孔 → 卵圓窩（約25%成人有 PFO）；動脈導管 → 動脈韌帶；靜脈導管 → 靜脈韌帶；臍靜脈 → 肝圓韌帶。"]]},
 {table:{head:["Embryologic error","Resulting lesion"],rows:[["Endocardial cushion defect","Primum ASD / AV septal defect, cleft anterior MV leaflet"],["Septum secundum deficiency","Secundum ASD (most common ASD)"],["Sinus venosus defect","ASD near SVC; partial anomalous right upper pulmonary venous return"],["Conotruncal (outflow) septation","Tetralogy of Fallot, transposition, truncus arteriosus"],["Persistent ductus","PDA"],["Arrested compaction (debated)","LV non-compaction"]],cite:"Standard embryology texts; Otto, Textbook of Clinical Echocardiography."}}
]},
{id:"d-devices",t:"Implanted devices & mechanical support",zh:"植入裝置與機械循環支持",blocks:[
 {table:{head:["Device","What the echo should report"],rows:[["Pacemaker / ICD leads","Lead path RA → RV; lead-related TR (leaflet impingement); vegetation or thrombus on lead"],["LAA occluder (e.g. Watchman)","Device position and compression, peri-device leak (Watchman trials: >5 mm considered significant), device-related thrombus, effusion"],["ASD / PFO occluder","Position, residual shunt (colour ± bubbles), erosion/effusion, thrombus"],["TAVR / TAVI","Valve position, gradients, paravalvular vs central AR (% circumference), LVOT obstruction"],["Mitral TEER (e.g. MitraClip)","Residual MR, mean MV gradient (iatrogenic MS), single-leaflet detachment, ASD from transseptal access"],["LVAD","Inflow cannula toward MV, outflow in ascending aorta, AV opening frequency, septal position (midline), RV function; ramp study"],["Impella","Inlet in LV ~3.5–4 cm below the aortic annulus, outlet above the AV; clear of MV apparatus"],["VA-ECMO","LV distension, AV opening, LV thrombus, readiness for weaning"]],cite:"ASE guideline on mechanical circulatory support echo (2015); ASE/SCAI structural intervention imaging statements. Thresholds vary by device; follow manufacturer/lab protocol."}},
 {pit:["Device reverberation and shadowing can hide thrombus — use off-axis views and colour.","裝置的混響及聲影會遮蓋血栓，應用偏軸切面及彩色多普勒。"]}
]},
{id:"d-other",t:"Other cardiomyopathies, cardio-oncology & other modalities",zh:"其他心肌病、腫瘤心臟學與其他影像",blocks:[
 {b:[["LV non-compaction: two-layer myocardium with deep trabecular recesses filled by colour flow; non-compacted : compacted ratio >2 in end-systole (Jenni criteria, short axis).","左室心肌致密化不全：兩層心肌，深隱窩內有彩色血流；收縮末期非致密/致密 >2（Jenni 標準）。"],
     ["Infiltrative disease: amyloid — thick walls, granular texture, biatrial enlargement, restrictive filling, apical-sparing ('cherry on top') GLS pattern; Fabry — LVH ± binary endocardial sign (non-specific); sarcoid — basal septal thinning, aneurysms.","浸潤性疾病：澱粉樣變 — 壁厚、顆粒狀、雙房擴大、限制性充盈、心尖保留的 GLS 圖；Fabry — LVH ± 雙層心內膜徵（非特異）；結節病 — 基底間隔變薄、室壁瘤。"],
     ["Takotsubo: apical (or other) ballooning beyond a single coronary territory, often after stress; usually recovers in weeks.","Takotsubo：超越單一冠脈供血範圍的心尖氣球樣變，多於壓力後出現，數週內恢復。"],
     ["Cardio-oncology: a relative GLS fall >15% from baseline is likely significant; LVEF drop >10 points to below normal defines cancer-therapy cardiac dysfunction (ASE/EACVI 2014; 2022 ESC uses LVEF <50% thresholds). Use the same machine/vendor for serial GLS.","腫瘤心臟學：GLS 較基線相對下降 >15% 可能有意義；LVEF 下降 >10 個百分點至正常以下即為治療相關心功能不全（ASE/EACVI 2014；2022 ESC 採用 LVEF <50%）。追蹤 GLS 要用同一機器/廠商。"]]},
 {table:{head:["Modality","Strength to recognise"],rows:[["Cardiac CT / CTA","Coronary anatomy & calcium, TAVR annulus sizing, aorta, calcification"],["Cardiac MRI","Reference for volumes & EF, late gadolinium enhancement (scar, myocarditis, infiltration), tissue characterisation"],["Nuclear (SPECT/PET)","Myocardial perfusion and viability; PYP scan for ATTR amyloid"],["Cardiac catheterisation","Direct pressures, coronary angiography; gold standard for haemodynamics"]],cite:"Braunwald's Heart Disease; Feigenbaum's Echocardiography."}}
]}
];
NOTES.C=[
{id:"c-anat",t:"Valve anatomy & the views that show it",zh:"瓣膜解剖與對應切面",blocks:[
 {b:[["Mitral: anterior (A1–A3) and posterior (P1–P3) leaflets; anterolateral and posteromedial papillary muscles. Annulus is saddle-shaped.","二尖瓣：前葉 A1–A3、後葉 P1–P3；前外側及後內側乳頭肌；瓣環呈馬鞍形。"],
     ["Aortic: right, left and non-coronary cusps. In PSAX the non-coronary cusp sits next to the interatrial septum.","主動脈瓣：右冠瓣、左冠瓣、無冠瓣；PSAX 中無冠瓣緊貼房間隔。"],
     ["Tricuspid: anterior, septal and posterior leaflets. Pulmonic: anterior, left and right cusps.","三尖瓣：前葉、隔葉、後葉。肺動脈瓣：前、左、右瓣。"],
     ["Click a view to see which structures and leaflets it shows.","點擊切面查看所見結構和瓣葉。"]]},
 {widget:"views"},
 {pearl:["Diagnose MVP only in PLAX (or long-axis views): >2 mm displacement beyond the annular plane. In A4C the saddle-shaped annulus makes a normal valve look prolapsed.","二尖瓣脫垂只在 PLAX（長軸）診斷：超出瓣環平面 >2 mm。A4C 因馬鞍形瓣環容易誤判。"]}
]},
{id:"c-as",t:"Aortic stenosis",zh:"主動脈瓣狹窄",blocks:[
 {table:{head:["","Sclerosis","Mild","Moderate","Severe"],rows:[
  ["Peak velocity (m/s)","≤2.5","2.6–2.9","3.0–3.9","≥4.0"],
  ["Mean gradient (mmHg)","—","<20","20–39","≥40"],
  ["AVA (cm²)","—",">1.5","1.0–1.5","<1.0"],
  ["AVA index (cm²/m²)","—",">0.85","0.60–0.85","<0.6"],
  ["Velocity ratio (DVI)","—",">0.50","0.25–0.50","<0.25"]],sev:[4],cite:"ASE/EACVI AS update 2017; ACC/AHA 2020. Very severe: Vmax ≥5 m/s or MG ≥60 mmHg."}},
 {b:[["Find the highest velocity: sample from apical 5C/3C, right parasternal, suprasternal and subcostal with the non-imaging (Pedoff) CW probe.","從心尖、右胸骨旁、胸骨上窩、劍突下多窗口用 CW（含 Pedoff 探頭）尋找最高速度。"],
     ["Continuity: AVA = (0.785 × LVOT D² × LVOT VTI) ÷ AV VTI. LVOT diameter error is squared — the biggest source of error.","連續方程：AVA =（0.785 × LVOT 直徑² × LVOT VTI）÷ AV VTI；LVOT 直徑誤差被平方放大。"],
     ["Low-flow, low-gradient AS with reduced EF (AVA <1.0, MG <40, EF <50%): low-dose dobutamine. True severe if AVA stays ≤1.0 while MG reaches ≥40 or Vmax ≥4. Contractile reserve = SV rises ≥20%.","低流量低壓差 AS（EF 下降）：低劑量多巴酚丁胺。若 AVA 仍 ≤1.0 而 MG ≥40 或 Vmax ≥4 為真性嚴重；SV 上升 ≥20% 為有收縮儲備。"],
     ["Paradoxical low-flow AS: preserved EF but SVi <35 mL/m² (small, thick LV).","矛盾性低流量 AS：EF 正常但 SVi <35 mL/m²。"]]},
 {pit:["AS jet vs MR jet on CW: MR is longer (starts at MV closure, includes IVCT and IVRT) and faster (5–6 m/s). AS starts after a short delay at AV opening.","CW 區分 AS 與 MR：MR 更長（包括等容期）且更快（5–6 m/s）。"]},
 {pearl:["Subvalvular obstruction (membrane) or supravalvular stenosis: use PW to step through the LVOT to find where velocity jumps.","瓣下（隔膜）或瓣上狹窄：用 PW 逐步沿 LVOT 移動，找出速度驟升的位置。"]}
]},
{id:"c-ar",t:"Aortic regurgitation",zh:"主動脈瓣反流",blocks:[
 {table:{head:["Parameter","Mild","Moderate","Severe"],rows:[
  ["Vena contracta (cm)","<0.3","0.3–0.6",">0.6"],
  ["Jet width / LVOT (%)","<25","25–64","≥65"],
  ["CW pressure half-time (ms)",">500","200–500","<200"],
  ["Descending aorta flow reversal","Brief, early","Intermediate","Holodiastolic (end-diastolic V >20 cm/s)"],
  ["Regurgitant volume (mL)","<30","30–59","≥60"],
  ["Regurgitant fraction (%)","<30","30–49","≥50"],
  ["EROA (cm²)","<0.10","0.10–0.29","≥0.30"]],sev:[3],cite:"ASE Native Valvular Regurgitation 2017."}},
 {b:[["Causes: bicuspid AV, root dilation (Marfan, hypertension), endocarditis, rheumatic, dissection, outlet VSD.","病因：二葉瓣、根部擴張、心內膜炎、風濕、夾層、流出道 VSD。"],
     ["Chronic AR → eccentric LVH and LV dilation. Acute severe AR (dissection, endocarditis) → premature MV closure, short PHT, no LV dilation — an emergency.","慢性 AR 導致離心性肥厚與 LV 擴張；急性嚴重 AR 出現二尖瓣提前關閉，屬緊急情況。"],
     ["AR jet hitting the anterior MV leaflet causes diastolic fluttering (M-mode) and a functional MS-like murmur (Austin Flint).","AR 射流沖擊二尖瓣前葉，M-mode 可見舒張期顫動（Austin Flint 雜音）。"]]},
 {pit:["PHT shortens with raised LVEDP or vasodilators even without severe AR. Use it with other parameters.","LVEDP 升高或使用血管擴張劑時 PHT 也會縮短，需配合其他指標判斷。"]}
]},
{id:"c-ms",t:"Mitral stenosis",zh:"二尖瓣狹窄",blocks:[
 {table:{head:["","Mild","Moderate","Severe"],rows:[
  ["MVA (cm²)",">1.5","1.0–1.5","<1.0  (ACC/AHA 2020: severe ≤1.5)"],
  ["Mean gradient (mmHg)*","<5","5–10",">10"],
  ["Pressure half-time (ms)","<150","150–219","≥220"],
  ["PASP (mmHg)","<30","30–50",">50"]],sev:[3],cite:"ASE/EAE 2009 grading; ACC/AHA 2020 defines severe rheumatic MS as MVA ≤1.5 cm² (PHT ≥150 ms). *Gradient depends on heart rate and flow."}},
 {b:[["Rheumatic MS: commissural fusion, 'hockey-stick' (doming) anterior leaflet in PLAX, fish-mouth orifice in PSAX, LA enlargement, LA/LAA thrombus.","風濕性 MS：瓣聯合融合、PLAX 前葉呈曲棍球棒狀、PSAX 魚嘴狀開口、左房擴大、可有血栓。"],
     ["Planimetry is the reference: PSAX, sweep to the leaflet tips (smallest orifice), mid-diastole, low gain.","瓣口面積描記為參考標準：PSAX、掃到瓣尖最小開口、舒張中期、低增益。"],
     ["MVA = 220 ÷ PHT. Inaccurate right after balloon valvotomy, with significant AR, or abnormal LV compliance.","MVA = 220 ÷ PHT；在球囊擴張術後早期、明顯 AR 或 LV 順應性異常時不準確。"],
     ["Wilkins score (mobility, thickening, calcification, subvalvular apparatus, 1–4 each). ≤8 favours percutaneous balloon valvotomy.","Wilkins 評分（活動度、增厚、鈣化、瓣下結構，各 1–4 分）；≤8 適合球囊擴張。"],
     ["Calcific (degenerative) MS from mitral annular calcification starts at the annulus, not the tips; common in elderly/renal failure.","退化性 MS 由瓣環鈣化引起，從瓣環開始而非瓣尖。"]]}
]},
{id:"c-mr",t:"Mitral regurgitation",zh:"二尖瓣反流",blocks:[
 {table:{head:["Parameter","Mild","Moderate","Severe"],rows:[
  ["Vena contracta (cm)","<0.3","0.3–0.69","≥0.7"],
  ["Colour jet area","Small central, <20% LA","Variable","Large central >40% LA, or wall-hugging eccentric jet"],
  ["EROA (PISA) (cm²)","<0.20","0.20–0.39","≥0.40"],
  ["Regurgitant volume (mL)","<30","30–59","≥60"],
  ["Regurgitant fraction (%)","<30","30–49","≥50"],
  ["Pulmonary vein flow","S dominant","Blunted S","Systolic flow reversal"],
  ["Mitral inflow","A dominant","Variable","E dominant, E >1.2 m/s"],
  ["CW signal","Faint, parabolic","Dense","Dense, triangular (early peak)"]],sev:[3],cite:"ASE 2017. Secondary MR: EROA ≥0.40 cm² is severe per ACC/AHA 2020; a crescent-shaped orifice may underestimate EROA."}},
 {b:[["Carpentier: Type I normal leaflet motion (annular dilation, perforation); Type II excessive motion (prolapse, flail); Type IIIa restricted in systole and diastole (rheumatic); Type IIIb restricted in systole (ischemic/functional tethering).","Carpentier 分型：I 型瓣葉活動正常；II 型過度（脫垂、連枷）；IIIa 收縮舒張均受限（風濕）；IIIb 收縮期受限（缺血/功能性）。"],
     ["Jet direction points AWAY from the prolapsing leaflet and TOWARD the restricted leaflet. Posterior leaflet prolapse → anteriorly directed jet.","射流方向背離脫垂瓣葉、朝向受限瓣葉；後葉脫垂 → 射流指向前方。"],
     ["PISA: baseline-shift the colour scale toward the jet (aliasing velocity 30–40 cm/s), zoom, measure radius at mid-systole.","PISA：將彩色基線往射流方向移動（混疊速度 30–40 cm/s），放大，於收縮中期量半徑。"]]},
 {pit:["Colour jet area is gain-, PRF- and pressure-dependent. Eccentric wall-hugging jets look smaller than they are (Coanda effect).","彩色射流面積受增益、PRF 及壓力影響；偏心貼壁射流看起來比實際小（Coanda 效應）。"]}
]},
{id:"c-right",t:"Tricuspid & pulmonic valves",zh:"三尖瓣與肺動脈瓣",blocks:[
 {table:{head:["TR parameter","Mild","Moderate","Severe"],rows:[
  ["Vena contracta (cm)","<0.3","0.3–0.69","≥0.7"],["EROA (cm²)","<0.20","0.20–0.39","≥0.40"],["Regurgitant volume (mL)","<30","30–44","≥45"],["Jet area (cm²)","<5","5–10",">10"],["Hepatic vein flow","Systolic dominance","Systolic blunting","Systolic flow reversal"],["CW signal","Faint, parabolic","Dense, parabolic","Dense, triangular, early peak"]],sev:[3],cite:"ASE 2017. Newer grading adds 'massive' and 'torrential' beyond severe."}},
 {table:{head:["Lesion","Severe criteria"],rows:[
  ["Tricuspid stenosis","Mean gradient ≥5 mmHg, PHT ≥190 ms, TVA ≤1.0 cm², inflow VTI >60 cm"],
  ["Pulmonic stenosis","Peak V >4 m/s (peak gradient >64 mmHg); moderate 3–4 m/s (36–64); mild <3 m/s"],
  ["Pulmonic regurgitation","Dense CW with steep deceleration ending before end-diastole, PHT <100 ms, jet width >50% of annulus, PR index <0.77"]],sev:[1]}},
 {b:[["Carcinoid heart disease: thick, retracted, fixed TV and PV leaflets → TR and PS. Left-sided only with PFO or lung metastases.","類癌心臟病：三尖瓣及肺動脈瓣增厚、回縮、固定；左心受累只見於 PFO 或肺轉移。"],
     ["Functional TR is the most common TR: annular dilation from RV/RA enlargement or AF. Annulus >40 mm (or >21 mm/m²) supports TV repair at left-sided surgery.","功能性 TR 最常見：右心擴大或房顫導致瓣環擴張；瓣環 >40 mm 支持在左心手術時同時修復。"]]}
]},
{id:"c-pros",t:"Prosthetic valves",zh:"人工瓣膜",blocks:[
 {b:[["Mechanical: bileaflet (most common, three orifices, small closing 'washing' jets are normal), tilting disc, caged ball. Need lifelong anticoagulation.","機械瓣：雙葉瓣（最常見，三個開口，少量閉合「沖洗」射流屬正常）、傾斜碟瓣、籠球瓣；需終身抗凝。"],
     ["Biological: stented, stentless, homograft, transcatheter (TAVR/TAVI). Degenerate over 10–15 years.","生物瓣：有支架、無支架、同種異體、經導管（TAVR）；約 10–15 年退化。"],
     ["Paravalvular leak = outside the sewing ring (abnormal). Transvalvular = through the valve. Rocking motion of the ring = dehiscence.","瓣周漏 = 縫合環外（異常）；瓣內反流 = 穿過瓣膜。縫合環搖擺 = 瓣膜撕脫。"],
     ["Pressure recovery and small bileaflet valves can overestimate gradients.","壓力恢復及小號雙葉瓣可高估壓差。"]]},
 {table:{head:["Prosthetic aortic","Normal","Possible stenosis","Significant stenosis"],rows:[
  ["Peak velocity (m/s)","<3","3–4",">4"],["Mean gradient (mmHg)","<20","20–35",">35"],["DVI (LVOT VTI ÷ AV VTI)","≥0.30","0.25–0.29","<0.25"],["EOA (cm²)",">1.1","0.8–1.1","<0.8"],["Jet contour / AT (ms)","Triangular, early peak / <80","Intermediate / 80–100","Rounded, symmetric / >100"]],sev:[3],cite:"ASE Prosthetic Valves 2009 / 2024 update."}},
 {table:{head:["Prosthetic mitral","Normal","Possible stenosis","Significant stenosis"],rows:[
  ["Peak E velocity (m/s)","<1.9","1.9–2.5","≥2.5"],["Mean gradient (mmHg)","≤5","6–10",">10"],["VTI ratio (PrMV ÷ LVOT)","<2.2","2.2–2.5",">2.5"],["EOA (cm²)","≥2.0","1–2","<1"],["PHT (ms)","<130","130–200",">200"]],sev:[3]}},
 {pearl:["Patient–prosthesis mismatch (aortic): indexed EOA ≤0.85 cm²/m² moderate, ≤0.65 severe. The valve works normally but is too small for the patient.","人工瓣-患者不匹配（主動脈）：iEOA ≤0.85 為中度、≤0.65 為重度；瓣膜正常但對病人太小。"]}
]},
{id:"c-ie",t:"Infective endocarditis",zh:"感染性心內膜炎",blocks:[
 {b:[["Vegetation: irregular, mobile mass with independent oscillation on the LOW-pressure side — atrial side of MV/TV, ventricular side of AV/PV.","贅生物：不規則、具獨立擺動，位於低壓側——二/三尖瓣的心房面、主/肺動脈瓣的心室面。"],
     ["Complications: perivalvular abscess (echolucent or echodense area in the root, often aortic–mitral curtain), pseudoaneurysm, fistula, leaflet perforation, new dehiscence of a prosthesis.","併發症：瓣周膿腫、假性動脈瘤、瘻管、瓣葉穿孔、人工瓣新出現撕脫。"],
     ["TEE is more sensitive, especially for prosthetic valves, abscess and small vegetations. Echo evidence is a major Duke criterion.","TEE 更敏感，特別是人工瓣、膿腫及小贅生物；超聲證據為 Duke 主要標準。"],
     ["IV drug use → tricuspid valve. Vegetation >10 mm, very mobile, or with severe regurgitation = higher embolic/surgical risk.","靜脈注射毒品者常見三尖瓣受累；贅生物 >10 mm 或高度活動時栓塞風險高。"]]},
 {pit:["Non-infective look-alikes: Libman–Sacks (SLE, verrucous on both sides of MV), marantic/NBTE (malignancy), Lambl's excrescences, papillary fibroelastoma.","非感染性類似物：Libman–Sacks（紅斑狼瘡）、消耗性心內膜炎、Lambl 贅生物、乳頭狀纖維彈性瘤。"]}
]},
{id:"c-pros2",t:"Right-sided stenosis/regurgitation & prosthetic obstruction",zh:"右側瓣膜病與人工瓣阻塞",blocks:[
 {table:{head:["Lesion","Significant / severe signs"],rows:[["Tricuspid stenosis","Mean gradient ≥5 mmHg, inflow VTI >60 cm, PHT ≥190 ms, valve area ≤1 cm² (significant)"],["Pulmonic regurgitation (severe)","Dense jet with early termination; PR PHT <100 ms; jet width >50–70% of annulus; diastolic flow reversal in branch PAs"],["Pulmonic stenosis (severe)","Peak velocity >4 m/s, peak gradient >64 mmHg"]],cite:"ASE/EAE valve stenosis 2009 (Baumgartner); ASE native valvular regurgitation 2017 (Zoghbi)."}},
 {b:[["Prosthetic obstruction — thrombus vs pannus: thrombus is larger, softer (similar echogenicity to myocardium), mobile, linked to subtherapeutic anticoagulation and short history; pannus is small, dense, fixed under the sewing ring, slowly progressive.","人工瓣阻塞：血栓較大、較軟、可活動，常與抗凝不足及短病史有關；纖維增生（pannus）細小、緻密、固定於縫合環下、緩慢進展。"],
     ["Patient–prosthesis mismatch: high gradients from a normally functioning valve that is too small (AV: indexed EOA ≤0.85 cm²/m² moderate, ≤0.65 severe).","病人-人工瓣不匹配：瓣膜功能正常但太小導致高壓差（主動脈瓣 iEOA ≤0.85 中度、≤0.65 嚴重）。"]]},
 {pearl:["High gradient on a prosthetic AV? Check the DVI and acceleration time: DVI <0.25 and AT >100 ms suggest obstruction; normal DVI with high gradient suggests high flow or PPM.","人工主動脈瓣壓差高？看 DVI 及加速時間：DVI <0.25、AT >100 ms 提示阻塞；DVI 正常則考慮高流量或不匹配。"]}
]}
];
NOTES.B=[
{id:"b-tte",t:"2D TTE protocol & M-mode",zh:"經胸 2D 檢查流程與 M 型",blocks:[
 {table:{head:["Window","Views","Key uses"],rows:[
  ["Parasternal long axis","PLAX, RV inflow, RV outflow","LV dimensions, LVOT diameter, MV/AV morphology, MVP, effusion vs pleural"],
  ["Parasternal short axis","AV level, MV level, papillary, apex","AV cusps, PV/TV, VSD location, MV planimetry, wall motion"],
  ["Apical","4C, 5C, 2C, 3C (APLAX)","LVEF (Simpson), diastology, AS/MR Doppler, wall motion, RV focus"],
  ["Subcostal","4C, SAX, IVC","ASD, effusion, IVC/RAP, RV free wall thickness"],
  ["Suprasternal notch","Aortic arch long axis","Coarctation, dissection, descending aorta flow reversal, AS Vmax"],
  ["Right parasternal","Ascending aorta","AS Vmax (often the highest)"]]}},
 {b:[["Index mark: PLAX ≈ toward right shoulder (10–11 o'clock); PSAX rotate 90° clockwise (toward left shoulder); apical 4C ≈ 3 o'clock; A2C rotate ~60° counter-clockwise; A3C a further ~60°.","探頭標記：PLAX 指向右肩；PSAX 順時針轉 90°；A4C 約 3 點方向；A2C 逆時針轉約 60°；A3C 再轉約 60°。"],
     ["M-mode: highest temporal resolution (sample rate ~1000–2000/s). Uses: AV/MV motion, SAM, fluttering, TAPSE, LV dimensions, IVC collapse.","M 型：時間分辨率最高；用於瓣膜運動、SAM、顫動、TAPSE、LV 測量、IVC 塌陷。"],
     ["Classic M-mode signs: B-bump (raised LVEDP), increased E-point septal separation (EPSS >7 mm = low EF), mid-systolic AV notching (HCM/LVOT obstruction), MV diastolic flutter (AR).","經典 M 型徵象：B 峰（LVEDP 升高）、EPSS >7 mm（EF 低）、主動脈瓣收縮中期切跡（HCM）、二尖瓣舒張期顫動（AR）。"]]}
]},
{id:"b-doppler",t:"Spectral & colour Doppler technique",zh:"頻譜與彩色多普勒技術",blocks:[
 {table:{head:["Mode","Strength","Limit","Use"],rows:[
  ["PW","Range resolution (samples one depth)","Aliases above Nyquist","LVOT VTI, mitral inflow, PV flow"],
  ["CW","Measures very high velocity, no aliasing","No range resolution (range ambiguity)","AS, MR, TR, AR jets"],
  ["HPRF","Higher Nyquist than PW","Multiple sample gates → ambiguity","Intermediate velocities, LVOT obstruction"],
  ["Colour","Spatial map of flow, direction (BART: blue away, red toward)","Low frame rate, aliasing, gain-dependent","Regurgitant jets, shunts, PISA"],
  ["TDI","Low velocity, high amplitude signal","Angle-dependent","e′, a′, s′, RV S′"]]}},
 {b:[["Keep the beam parallel to flow. Angle <20° keeps error ≤6% (cos 20° = 0.94). At 60° the velocity is underestimated by 50%.","聲束保持與血流平行：<20° 誤差 ≤6%；60° 時低估 50%。"],
     ["Lower the wall filter for TDI and low velocities; raise it for high-velocity CW jets.","低速（TDI）時降低壁濾波；高速 CW 時提高。"],
     ["Optimise colour: narrow, shallow colour box, Nyquist 50–70 cm/s for regurgitant jets, gain just below speckle noise.","彩色優化：縮小並淺置彩色框；評估反流用 Nyquist 50–70 cm/s；增益調至剛好不出現雜訊。"]]}
]},
{id:"b-contrast",t:"Contrast (UEA) & agitated saline",zh:"超聲增強劑與生理鹽水發泡試驗",blocks:[
 {b:[["Ultrasound enhancing agents (Definity/perflutren lipid, Lumason/sulfur hexafluoride, Optison): microbubbles cross the lungs and opacify the LV.","超聲增強劑：微氣泡可通過肺循環並令左心室顯影。"],
     ["Indication: ≥2 contiguous segments not seen. Also LV thrombus, apical HCM, LVNC, pseudoaneurysm, stress echo.","適應症：≥2 個相鄰節段未能顯示；亦用於血栓、心尖 HCM、心肌緻密化不全、假性動脈瘤、負荷超聲。"],
     ["Use low MI (≈0.1–0.3) to avoid destroying bubbles. A high-MI 'flash' destroys bubbles for perfusion replenishment imaging. Focus at the mitral level or deeper; reduce gain.","使用低機械指數（約 0.1–0.3）避免破壞微氣泡；高 MI「閃爆」用於灌注再充盈。"],
     ["Swirling = too little contrast or too high MI; apical attenuation/shadowing = too much contrast.","渦旋 = 造影劑不足或 MI 太高；遠場衰減 = 造影劑過量。"],
     ["Monitor for reactions (rare anaphylaxis, back pain with Lumason); resuscitation equipment must be available.","監測不良反應（罕見過敏）；必須備有急救設備。"]]},
 {b:[["Agitated saline does NOT cross the lungs. Bubbles in the LA within 3 cardiac cycles of RA opacification = intracardiac shunt (PFO/ASD).","生理鹽水微泡不能通過肺循環；右房顯影後 3 個心動週期內左房出現微泡 = 心內分流。"],
     ["Bubbles appearing after 3–5 cycles, from the pulmonary veins = intrapulmonary shunt (AVM, hepatopulmonary syndrome).","3–5 個週期後由肺靜脈出現 = 肺內分流。"],
     ["Release of Valsalva transiently raises RA pressure above LA pressure and increases PFO detection. A femoral (IVC) injection streams toward the fossa ovalis.","Valsalva 釋放時右房壓短暫高於左房，提高 PFO 檢出率；股靜脈注射血流直指卵圓窩。"]]},
 {pearl:["Left arm saline filling the coronary sinus before the RA = persistent left SVC.","左臂注射後冠狀竇先於右房顯影 = 永存左上腔靜脈。"]}
]},
{id:"b-stress",t:"Stress echocardiography",zh:"負荷超聲心動圖",blocks:[
 {b:[["Target heart rate = 85% of age-predicted maximum (220 − age).","目標心率 = 年齡預測最大心率（220 − 年齡）的 85%。"],
     ["Treadmill: post-exercise images within 60–90 s (ideally <60 s). Bicycle: images during exercise (allows Doppler at peak).","跑步機：運動後 60–90 秒內（最好 <60 秒）取像；單車：可於運動中取像。"],
     ["Dobutamine: start 5–10 µg/kg/min, increase every 3 min to 40 µg/kg/min; add atropine if target HR not reached. Beta-blocker reverses side effects.","多巴酚丁胺：由 5–10 µg/kg/min 開始，每 3 分鐘遞增至 40；未達目標心率可加阿托品；β 阻滯劑可逆轉副作用。"],
     ["Positive (ischaemia): new or worsening WMA, LV cavity dilation, fall in EF. Normal response: all segments hyperkinetic, cavity smaller.","陽性：新出現或惡化的室壁運動異常、左室擴大、EF 下降；正常反應為全部節段運動增強、心腔縮小。"],
     ["Viability (DSE): biphasic response — improves at low dose, worsens at high dose = viable and ischaemic.","存活心肌：雙相反應——低劑量改善、高劑量惡化 = 存活且缺血。"],
     ["Stop for: target HR, significant new WMA, sustained VT/SVT, SBP fall >20 mmHg, severe hypertension (≈>220/120), intolerable symptoms.","終止指徵：達到目標心率、明顯新室壁運動異常、持續心律失常、收縮壓下降 >20 mmHg、嚴重高血壓、無法耐受症狀。"]]},
 {pearl:["Non-ischaemic stress echo: diastolic stress (E/e′ >14 at exercise), HCM provocation, MS/MR exercise gradients and PASP, low-gradient AS.","非缺血性負荷超聲：舒張負荷、HCM 誘發梗阻、MS/MR 運動壓差、低壓差 AS。"]}
]},
{id:"b-tee",t:"Assisting with TEE",zh:"協助經食道超聲",blocks:[
 {b:[["Before: NPO ≥4–6 h, consent, IV access, allergies, check contraindications (oesophageal stricture, tumour, perforation, recent GI bleed; varices relative). Remove dentures.","檢查前：禁食 ≥4–6 小時、知情同意、靜脈通路、過敏史、禁忌症；取出假牙。"],
     ["During: monitor SpO₂, BP, ECG; suction ready; bite block. Topical benzocaine can cause methaemoglobinaemia (cyanosis with normal PaO₂).","過程中：監測血氧、血壓、心電圖；備抽吸及咬口器。局部苯佐卡因可致高鐵血紅蛋白症。"],
     ["After: nothing by mouth until gag reflex returns (~1 h); clean probe with high-level disinfection and inspect for bite marks; log the probe.","檢查後：咽反射恢復前禁食；探頭需高水平消毒並檢查咬痕。"],
     ["Main indications: endocarditis/abscess, LAA thrombus before cardioversion, prosthetic valve dysfunction, aortic dissection, MV repair planning, source of embolism.","主要適應症：心內膜炎、復律前排除左心耳血栓、人工瓣功能障礙、主動脈夾層、二尖瓣修復評估、栓子來源。"]]},
 {table:{head:["TEE view","Angle","Shows"],rows:[
  ["ME four-chamber","0–10°","Chambers, MV, TV"],["ME AV short axis","30–45°","Three AV cusps, IAS"],["ME bicaval","90–110°","SVC, IVC, IAS, PFO"],["ME two-chamber","~90°","LAA, LV anterior/inferior walls"],["ME long axis","120–140°","LVOT, AV, MV A2/P2"],["ME LAA","~45–90°","LAA thrombus"],["Transgastric SAX","0–20°","LV mid-papillary wall motion"],["Descending aorta SAX/LAX","0° / 90°","Atheroma, dissection"]]}}
]},
{id:"b-strain3d",t:"Strain & 3D echo",zh:"應變與三維超聲",blocks:[
 {b:[["Speckle tracking follows acoustic 'speckles' frame by frame; angle-independent. Needs frame rate ~40–80 fps and good endocardial definition.","斑點追蹤逐幀追蹤聲學斑點，與角度無關；需要約 40–80 fps 幀率及清晰心內膜。"],
     ["GLS is negative (shortening). Normal ≈ −20%. Report the absolute value carefully: 'GLS −12%' is worse than '−20%'.","GLS 為負值（縮短）；正常約 −20%；−12% 比 −20% 更差。"],
     ["Bull's-eye patterns: apical sparing (amyloid), septal reduction at hypertrophied segments (HCM), basal inferolateral (Fabry), territorial (ischaemia).","牛眼圖：心尖保留（澱粉樣變）、肥厚節段下降（HCM）、基底下側壁（Fabry）、冠脈分佈（缺血）。"],
     ["3D: full-volume multi-beat acquisitions are prone to stitching artefacts (arrhythmia, breathing) — use breath hold. 3D LV volumes avoid foreshortening and geometric assumptions.","3D：多心動週期全容積易有拼接偽影，需屏氣；3D LV 容積無需幾何假設。"]]}
]},
{id:"b-nonisch",t:"Non-ischaemic stress & physiologic maneuvers",zh:"非缺血性負荷與生理動作",blocks:[
 {table:{head:["Indication","Protocol","Positive / key result"],rows:[["Low-flow, low-gradient AS with reduced EF","Low-dose dobutamine (up to 20 µg/kg/min)","True severe: AVA stays ≤1.0 cm² with mean gradient ≥40 mmHg (or Vmax ≥4 m/s). Contractile (flow) reserve = SV rise ≥20%"],["HCM (latent obstruction)","Exercise (preferred) ± Valsalva/standing","LVOT gradient ≥30 mmHg = obstruction; ≥50 mmHg = haemodynamically significant"],["Diastolic stress test (dyspnoea)","Supine bike/treadmill","Abnormal: average E/e′ >14 (or septal >15) + TR >2.8 m/s with exercise"],["Mitral stenosis (symptom-discordant)","Exercise","Mean gradient >15 mmHg or PASP >60 mmHg"],["Asymptomatic severe AS/MR","Exercise","Symptoms, BP fall, or PASP >60 mmHg (MR) are adverse"]],cite:"ASE stress echo for non-ischaemic disease 2017 (Lancellotti et al.); ACC/AHA 2020 valve guideline; ASE/EACVI diastolic 2016; AHA/ACC HCM 2020."}},
 {table:{head:["Maneuver","Haemodynamic effect","Echo use"],rows:[["Valsalva (strain)","↓ preload","Unmasks pseudonormal filling (E/A falls ≥50%); ↑ HCM LVOT gradient"],["Standing","↓ preload","↑ HCM gradient"],["Squatting / passive leg raise","↑ preload (squat also ↑ afterload)","↓ HCM gradient"],["Handgrip","↑ afterload","↑ MR/AR murmur, ↓ HCM gradient"],["Amyl nitrite","↓ afterload (vasodilator)","↑ HCM gradient"],["Sniff / inspiration","↓ intrathoracic pressure","IVC collapse (RAP); right-sided flows rise with inspiration"]],cite:"Otto, Textbook of Clinical Echocardiography; Feigenbaum's Echocardiography."}}
]}
];
NOTES.E=[
{id:"e-wave",t:"Sound waves & propagation",zh:"聲波與傳播",blocks:[
 {b:[["Propagation speed in soft tissue = 1540 m/s (1.54 mm/µs). It depends on the medium only (stiffness ↑ speed, density ↓ speed).","軟組織聲速 1540 m/s，只由介質決定（硬度↑速度↑、密度↑速度↓）。"],
     ["Wavelength λ (mm) = 1.54 ÷ f (MHz). Higher frequency → shorter λ → better axial resolution but less penetration.","波長 λ（mm）= 1.54 ÷ 頻率（MHz）；頻率越高，軸向分辨率越好但穿透越差。"],
     ["Attenuation ≈ 0.5 dB/cm/MHz in soft tissue. Total = 0.5 × f × path length. Lung and bone attenuate far more; water/blood far less.","軟組織衰減約 0.5 dB/cm/MHz；肺和骨骼衰減大得多，水和血液很少。"],
     ["Decibels: +3 dB = intensity ×2, +10 dB = ×10; −3 dB = half; −10 dB = one-tenth.","分貝：+3 dB = 強度 ×2；+10 dB = ×10；−3 dB = 一半。"],
     ["Reflection at a boundary needs an impedance mismatch (Z = density × speed). %reflected = ((Z₂ − Z₁)/(Z₂ + Z₁))². Refraction needs oblique incidence AND different speeds (Snell's law).","反射需聲阻抗差（Z = 密度 × 聲速）；折射需斜入射且兩介質聲速不同。"]]},
 {widget:"physics"},
 {pearl:["The range equation: depth = (c × time)/2; every 13 µs of round-trip time = 1 cm of depth in soft tissue.","距離方程：深度 =（聲速 × 時間）/ 2；往返 13 µs = 1 cm 深度。"]}
]},
{id:"e-res",t:"Resolution, pulses & frame rate",zh:"分辨率、脈衝與幀率",blocks:[
 {table:{head:["Resolution","Determined by","Improve by"],rows:[
  ["Axial (longitudinal)","SPL ÷ 2 = (cycles × λ)/2","Higher frequency, fewer cycles per pulse (damping/backing)"],
  ["Lateral","Beam width","Focusing; is best at the focus (narrowest point); higher frequency"],
  ["Elevational (slice thickness)","Beam thickness","Matrix/2D-array probes"],
  ["Temporal","Frame rate","Shallower depth, narrower sector, fewer focal zones, lower line density"],
  ["Contrast","Grey-scale levels, dynamic range","Compression/post-processing"]]}},
 {b:[["Max PRF ≈ 77,000 ÷ depth (cm). Frame rate ≈ 77,000 ÷ (depth × lines per frame × focal zones).","最大 PRF ≈ 77,000 ÷ 深度（cm）；幀率 ≈ 77,000 ÷（深度 × 線數 × 焦點數）。"],
     ["Pulse duration and SPL are set by the transducer (not adjustable by sonographer). PRP and PRF change with depth.","脈衝持續時間及空間脈衝長度由探頭決定；PRP 和 PRF 隨深度改變。"],
     ["Near zone length (unfocused) = D²/(4λ). Larger crystal or higher frequency → longer near zone, less divergence in far field.","近場長度 = D²/(4λ)；晶片越大或頻率越高，近場越長、遠場發散越少。"],
     ["Transducer: PZT crystal thickness = λ/2; matching layer thickness = λ/4; backing layer shortens the pulse (improves axial resolution, reduces sensitivity).","晶片厚度 = λ/2；匹配層 = λ/4；背襯層縮短脈衝（改善軸向分辨率，降低靈敏度）。"],
     ["Harmonic imaging: receives 2f₀; reduces near-field and side-lobe artefacts and improves endocardial definition; valves can look thicker.","諧波成像：接收 2 倍頻率；減少近場及旁瓣偽影，但瓣膜看起來較厚。"]]}
]},
{id:"e-doppler",t:"Doppler physics & aliasing",zh:"多普勒物理與混疊",blocks:[
 {b:[["Doppler shift Δf = (2 × f₀ × V × cosθ) ÷ c. The shift is proportional to velocity and transmitted frequency.","多普勒頻移 Δf = 2 f₀ V cosθ / c，與速度及發射頻率成正比。"],
     ["Nyquist limit = PRF ÷ 2. If Δf exceeds it, PW aliases (wrap-around).","Nyquist 極限 = PRF ÷ 2；超出即混疊。"],
     ["Fix aliasing: switch to CW, shift the baseline, increase the scale (PRF), use a shallower sample volume, a lower-frequency transducer, or HPRF.","消除混疊：改用 CW、移動基線、提高 scale（PRF）、減淺取樣深度、用低頻探頭或 HPRF。"]]},
 {widget:"nyquist"},
 {pearl:["Lower transducer frequency reduces aliasing: for the same velocity it produces a smaller Doppler shift.","低頻探頭產生較小的多普勒頻移，所以較不易混疊。"]}
]},
{id:"e-art",t:"Artefacts",zh:"偽影",blocks:[{widget:"artifacts"},
 {pit:["Range ambiguity: with high PRF (or HPRF), echoes from a previous pulse arrive late and are placed too shallow.","距離模糊：PRF 高時，前一脈衝的回波晚到，被放在較淺的位置。"]}]},
{id:"e-bio",t:"Bioeffects, safety & instrumentation",zh:"生物效應、安全與儀器",blocks:[
 {b:[["ALARA: As Low As Reasonably Achievable. Lower output power first, then raise receiver gain. Minimise scan time.","ALARA 原則：先降低輸出功率，再提高接收增益；縮短掃描時間。"],
     ["Mechanical index MI = peak rarefactional pressure ÷ √f — relates to cavitation. Thermal index TI — relates to heating (TIS soft tissue, TIB bone, TIC cranial).","機械指數 MI 與空化相關；熱指數 TI 與升溫相關。"],
     ["Output power (transmit) affects patient exposure and the whole image. Receiver gain (overall/TGC) only amplifies returning echoes — no change in exposure.","發射功率影響病人暴露及整體圖像；接收增益只放大回波，不影響暴露量。"],
     ["Receiver order: amplification → compensation (TGC) → compression (dynamic range) → demodulation → rejection.","接收器順序：放大 → 補償（TGC）→ 壓縮 → 解調 → 抑制。"],
     ["Pre-processing (cannot be undone on a frozen image): TGC, write zoom, persistence, edge enhancement. Post-processing: read zoom, contrast variation, B-colour.","前處理（凍結後不可改）：TGC、寫放大、余輝；後處理：讀放大、對比調整、偽彩。"]]}
]},
{id:"e-math",t:"Math, 3D/contrast optimisation & QA",zh:"數學、3D/造影優化與品質保證",blocks:[
 {table:{head:["Prefix","Factor"],rows:[["giga (G)","10⁹"],["mega (M)","10⁶"],["kilo (k)","10³"],["centi (c)","10⁻²"],["milli (m)","10⁻³"],["micro (µ)","10⁻⁶"],["nano (n)","10⁻⁹"]],cite:"Edelman, Understanding Ultrasound Physics; Kremkau, Sonography Principles and Instruments."}},
 {b:[["Direct vs inverse: frequency ↑ → wavelength ↓, period ↓, penetration ↓, axial resolution ↑. Depth ↑ → PRF ↓, frame rate ↓.","正比與反比：頻率↑ → 波長↓、週期↓、穿透↓、軸向解析↑；深度↑ → PRF↓、幀率↓。"],
     ["3D: volume rate trades against sector size and density. Narrow the volume, or use multi-beat acquisition (needs a regular rhythm and breath-hold; watch for stitch artefacts).","3D：體積幀率與扇區大小及線密度互相取捨；縮窄體積或用多心搏擷取（需規則心律及閉氣，留意拼接偽像）。"],
     ["Contrast (UEA) imaging: low/very low MI (≈0.1–0.3) to avoid destroying microbubbles; focus near the mitral annulus; brief high-MI 'flash' destroys bubbles for perfusion replenishment. Swirling at the apex = too much destruction or too little agent; attenuation (shadowing) basally = too much agent.","造影成像：低或極低 MI（約0.1–0.3）避免破壞微泡；焦點置於二尖瓣環附近；短暫高 MI「閃爍」用於灌注再充盈。心尖漩渦＝破壞過多或劑量不足；基底聲影＝造影劑過多。"],
     ["Quality assurance: tissue-mimicking phantoms test depth calibration, axial/lateral resolution, dead zone, and sensitivity; schedule electrical safety checks; audit measurement variability between staff.","品質保證：以仿組織體模測試深度校準、軸向/側向解析、死區及靈敏度；定期電氣安全檢查；稽核人員間測量差異。"]]}
]}
];
NOTES.A=[
{id:"a-prep",t:"Before the study",zh:"檢查前準備",blocks:[
 {b:[["Verify the order and indication; confirm patient identity with two identifiers (name + DOB or MRN).","核對醫囑與適應症；用兩個識別資料確認病人身份。"],
     ["Review history, medications, prior echo/reports, ECG rhythm, BP, height/weight (for BSA and indexing).","查閱病史、藥物、既往報告、心律、血壓、身高體重（計算 BSA）。"],
     ["Explain the procedure, obtain consent where needed (TEE, contrast, stress), and check allergies.","解釋流程，按需要取得同意（TEE、造影、負荷），核對過敏史。"],
     ["Hand hygiene and standard precautions; transmission-based precautions for isolation patients; clean the probe and cable between patients.","手衛生及標準預防；隔離病人按傳播途徑防護；每位病人之間清潔探頭與導線。"],
     ["Record BP at the time of the study — needed for LAP, LVEDP, VSD and MR calculations.","檢查時記錄血壓，用於計算 LAP、LVEDP、VSD 等。"]]}
]},
{id:"a-ergo",t:"Ergonomics & safety",zh:"人體工學與安全",blocks:[
 {b:[["Keep shoulder abduction <30°, wrist neutral, elbow close to the body. Adjust bed and chair height; support the arm and the cable.","肩外展 <30°、手腕中立、肘貼近身體；調整床椅高度並支撐手臂及導線。"],
     ["Vary scanning hand/position and take micro-breaks to reduce musculoskeletal injury.","交替姿勢並短暫休息，減少肌肉骨骼損傷。"],
     ["Electrical safety: inspect cables and probes for cracks; report and remove damaged equipment.","電氣安全：檢查導線和探頭有無破損，損壞須通報並停用。"]]}
]},
{id:"a-comm",t:"Communication & reporting",zh:"溝通與報告",blocks:[
 {b:[["Prepare a preliminary worksheet with measurements, calculations and images for the reading physician.","為判讀醫生準備初步記錄，包括測量、計算和影像。"],
     ["Critical findings must be reported to the physician immediately: tamponade, aortic dissection, mobile LV/LA thrombus, large mobile vegetation, free-wall rupture/pseudoaneurysm, new severe valve dysfunction, prosthetic valve thrombosis, massive PE signs.","危急值須立即通報：心包填塞、主動脈夾層、活動性血栓、大型活動贅生物、游離壁破裂、新出現嚴重瓣膜功能障礙、人工瓣血栓、大面積肺栓塞徵象。"],
     ["Sonographers describe findings; physicians interpret and diagnose to the patient. Protect privacy (HIPAA/PDPO).","超聲技術員描述所見；診斷由醫生作出並告知病人。保護私隱。"],
     ["Document the time, the person notified and the read-back of critical results.","記錄通報時間、接收人及回讀確認。"]]}
]},
{id:"a-bls",t:"Patient safety, BLS & infection control",zh:"病人安全、基本生命支援與感染控制",blocks:[
 {b:[["Confirm identity with two identifiers (e.g. name + date of birth) before every study — never room number alone.","每次檢查前以兩項識別資料（如姓名＋出生日期）核對病人，不可只靠床號。"],
     ["Standard precautions apply to every patient; add contact, droplet or airborne precautions as the isolation sign requires. Hand hygiene before and after patient contact.","所有病人均採用標準預防；按隔離標示加上接觸、飛沫或空氣傳播預防。接觸病人前後要做手衛生。"],
     ["Transducer reprocessing (Spaulding): a TTE probe on intact skin is non-critical → clean + low-level disinfection; a TEE probe touches mucosa, so it is semi-critical → high-level disinfection, a leak test, and logged traceability.","探頭消毒（Spaulding 分類）：接觸完整皮膚的 TTE 探頭屬非關鍵 → 清潔＋低度消毒；TEE 探頭接觸黏膜屬半關鍵 → 高度消毒、漏電測試並記錄。"],
     ["Falls and line safety: lock the bed, raise rails as needed, watch IV lines, drains and ECG leads during repositioning.","防跌與管線安全：鎖好病床、按需要升起床欄，轉身時留意靜脈導管、引流管及心電導線。"]]},
 {table:{head:["Adult BLS (AHA 2020)","Value"],rows:[["Check","Responsiveness + breathing/pulse ≤10 s"],["Compression rate","100–120 /min"],["Compression depth","5–6 cm (2–2.4 in), full recoil"],["Ratio (no advanced airway)","30 : 2"],["Interruptions","Keep pauses <10 s"],["AED","Attach as soon as available; shock if advised"]],cite:"American Heart Association Guidelines for CPR and ECC, 2020."}},
 {pit:["During a stress or contrast study, stop and call for help at the first sign of instability — the sonographer starts BLS, the team brings the crash cart.","負荷或造影檢查中病人一出現不穩定即停止並求救；技術員開始 BLS，團隊帶急救車。"]}
]},
{id:"a-pharm",t:"Pharmacology, ethics & privacy",zh:"藥理、醫學倫理與私隱",blocks:[
 {table:{head:["Drug","Role in the echo lab","Note / reversal"],rows:[["Dobutamine","β1 agonist for DSE (↑ contractility and HR)","Ischaemia/arrhythmia: stop infusion; IV β-blocker (e.g. esmolol/metoprolol)"],["Atropine","Anticholinergic; augments HR when target not reached","Caution: glaucoma, prostatism"],["Midazolam","Benzodiazepine sedation for TEE","Reversed by flumazenil"],["Fentanyl","Opioid analgesia for TEE","Reversed by naloxone"],["Topical benzocaine","Throat anaesthetic for TEE","Risk of methaemoglobinaemia (cyanosis, low SpO₂ unresponsive to O₂) → methylene blue"],["Ultrasound enhancing agents (Definity, Lumason, Optison)","LV opacification / endocardial border definition","Boxed warning for cardiopulmonary reactions; have resuscitation ready; check product allergy (e.g. PEG)"],["Adenosine / regadenoson / dipyridamole","Vasodilator stress","Dipyridamole reversed by aminophylline"]],cite:"Drug labels (FDA) and ASE contrast guideline 2018 (Porter et al.). Verify local protocol for doses."}},
 {b:[["Four principles of medical ethics: autonomy (informed consent, right to refuse), beneficence, non-maleficence, justice.","醫學倫理四原則：自主（知情同意、拒絕權）、行善、不傷害、公正。"],
     ["HIPAA protects identifiable health information (PHI). Share only the minimum necessary, never discuss patients in public areas, and log off workstations. In Hong Kong the equivalent is the PDPO.","HIPAA 保護可識別健康資料（PHI）：只分享必需的最少資料，不在公眾地方討論病人，離開時登出。香港相應法例為《個人資料（私隱）條例》。"],
     ["Scope of practice: the sonographer does not give the diagnosis to the patient; refer questions to the physician.","執業範圍：技術員不向病人提供診斷，問題交由醫生解答。"]]}
]}
];
